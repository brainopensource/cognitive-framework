      <text x="345" y="23" fill="#fff" font-size="10" font-weight="bold">STABLE</text>

      <text x="20" y="65" fill="#f0f6fc" font-size="12" font-weight="bold">Feature Matrix:</text>
      <text x="20" y="85" fill="#3fb950" font-size="11">✅ L1–L5 Radix Prompt Prefix Compaction</text>
      <text x="20" y="105" fill="#3fb950" font-size="11">✅ Avoided Dead-Ends &amp; Invariant Memory</text>
      <text x="20" y="125" fill="#3fb950" font-size="11">✅ Head/Tail Log Paging (&gt;1000 lines)</text>
      <text x="20" y="145" fill="#8b949e" font-size="11">❌ SBFL Fault Localization</text>
      <text x="20" y="165" fill="#8b949e" font-size="11">❌ Speculative Multi-Branch MCTS</text>

