<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><title>LDA Atlas</title><style>
:root{
  color-scheme:dark;
  --bg:#0b0f19;
  --panel:#141b26;
  --panel-sub:#1c2434;
  --panel-hover:#242f44;
  --border:#2a364f;
  --text:#c9d1d9;
  --heading:#f0f6fc;
  --muted:#8b949e;
  --accent:#38bdf8;
  --accent-glow:rgba(56,189,248,0.15);
  --c-red:#ff7b72;
  --c-red-bg:rgba(255,123,114,0.12);
  --c-red-border:#8e1519;
  --c-orange:#ffa657;
  --c-orange-bg:rgba(255,166,87,0.12);
  --c-orange-border:#8c4a17;
  --c-yellow:#d29922;
  --c-yellow-bg:rgba(210,153,34,0.12);
  --c-yellow-border:#7d5a12;
  --c-green:#56d364;
  --c-green-bg:rgba(86,211,100,0.12);
  --c-green-border:#1b5e30;
  --c-purple:#bc8cff;
  --c-purple-bg:rgba(188,140,255,0.12);
  --c-purple-border:#6e40aa;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;line-height:1.5}
header{padding:14px 24px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;gap:20px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:10px}
.logo-icon{font-size:20px}
h1{font-size:17px;margin:0;color:var(--heading);font-weight:600;letter-spacing:-0.2px}
nav{display:flex;gap:6px}
nav button{background:transparent;color:var(--muted);border:1px solid transparent;border-radius:6px;padding:6px 12px;font-weight:500;cursor:pointer;transition:all 0.15s ease}
nav button:hover{color:var(--text);background:var(--panel-sub)}
nav button.active{color:var(--accent);background:var(--accent-glow);border-color:rgba(56,189,248,0.3);font-weight:600}
button,input,select{background:var(--panel-sub);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px 11px;font:inherit}
button{cursor:pointer;transition:all 0.15s ease}
button:hover{border-color:var(--accent);color:var(--heading)}
main{padding:20px 24px;max-width:1520px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.card,.panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px}
.card b{font-size:22px;display:block;margin-top:6px;color:var(--heading)}
.muted{color:var(--muted)}
.panel{margin-top:16px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.5px}
.bar{height:7px;background:var(--panel-sub);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}

/* Badges & Color Tokens */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:600;line-height:1;border:1px solid transparent}
.badge-red{background:var(--c-red-bg);color:var(--c-red);border-color:var(--c-red-border)}
.badge-orange{background:var(--c-orange-bg);color:var(--c-orange);border-color:var(--c-orange-border)}
.badge-yellow{background:var(--c-yellow-bg);color:var(--c-yellow);border-color:var(--c-yellow-border)}
.badge-green{background:var(--c-green-bg);color:var(--c-green);border-color:var(--c-green-border)}
.badge-purple{background:var(--c-purple-bg);color:var(--c-purple);border-color:var(--c-purple-border)}
.badge-muted{background:var(--panel-sub);color:var(--muted);border-color:var(--border)}

/* Document Explorer Toolbar & Stats */
.stats-banner{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;padding:10px 14px;background:var(--panel);border:1px solid var(--border);border-radius:8px;align-items:center;font-size:13px}
.stats-banner span b{color:var(--heading)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;background:var(--panel);padding:12px 14px;border-radius:8px;border:1px solid var(--border)}
.toolbar .search-box{flex:1;min-width:220px}
.btn-group{display:inline-flex;border-radius:6px;overflow:hidden;border:1px solid var(--border)}
.btn-group button{border:none;border-radius:0;border-right:1px solid var(--border);padding:6px 11px;background:var(--panel-sub);font-size:13px}
.btn-group button:last-child{border-right:none}
.btn-group button.active{background:var(--accent);color:#081018;font-weight:600}
.toggle-label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;font-size:13px;color:var(--heading)}

/* Nested Folder Hierarchy & Tree Indentation */
.tree-container{display:flex;flex-direction:column;gap:10px}
.folder-node{display:flex;flex-direction:column;gap:6px}
.folder-card{background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden;transition:border-color 0.2s}
.folder-card.has-32k{border-color:var(--c-red-border)}
.folder-header{padding:10px 14px;background:var(--panel-sub);display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;user-select:none}
.folder-header:hover{background:var(--panel-hover)}
.folder-title{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--heading)}
.arrow-icon{font-size:11px;color:var(--muted);display:inline-block;width:14px;text-align:center}
.folder-meta{display:flex;align-items:center;gap:8px}
.distribution-bar{display:flex;height:6px;width:90px;border-radius:3px;overflow:hidden;background:var(--bg)}
.distribution-bar span{height:100%}
.folder-children{display:flex;flex-direction:column;gap:8px;padding:8px 12px;border-left:2px solid var(--border);margin-left:12px;margin-top:2px}
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px;margin-top:2px}
.file-card{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;position:relative;transition:all 0.15s ease;cursor:pointer}
.file-card:hover{border-color:var(--accent);transform:translateY(-1px);background:var(--panel)}
.file-card.is-32k{border-color:var(--c-red-border);background:linear-gradient(180deg, rgba(255,123,114,0.06) 0%, var(--bg) 100%)}
.file-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.file-path{font-weight:600;color:var(--heading);word-break:break-all;font-size:13px}
.copy-btn{border:none;background:transparent;color:var(--muted);padding:2px 4px;font-size:11px;border-radius:4px;cursor:pointer}
.copy-btn:hover{color:var(--accent);background:var(--panel-sub)}
.file-meta-row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto}

/* File Inspector Modal */
.modal-backdrop{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.65);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center}
.modal-content{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:24px;max-width:640px;width:90%;position:relative;box-shadow:0 12px 32px rgba(0,0,0,0.5)}
.modal-close{position:absolute;top:14px;right:14px;background:var(--panel-sub);border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:4px 8px;cursor:pointer}
.modal-close:hover{color:var(--text)}

/* Toast Notification */
#toast{position:fixed;bottom:24px;right:24px;background:var(--panel-sub);border:1px solid var(--accent);color:var(--heading);padding:8px 14px;border-radius:6px;font-size:13px;display:none;z-index:300;box-shadow:0 6px 20px rgba(0,0,0,0.4)}

@media(max-width:768px){header,.toolbar{flex-direction:column;align-items:stretch}.folder-header{flex-direction:column;align-items:flex-start}.folder-children{margin-left:6px;padding:6px}}
</style></head><body>
<header>
  <div class="brand">
    <span class="logo-icon">🪐</span>
    <h1>LDA / LLM Docs Atlas</h1>
    <span class="badge badge-purple">v0.9.0b1</span>
  </div>
  <nav>
    <button data-view='overview'>Overview</button>
    <button data-view='documents' class='active'>Explorer</button>
    <button data-view='context'>Context</button>
    <button data-view='graph'>Graph</button>
    <button data-view='quality'>Quality</button>
    <button data-view='providers'>Providers</button>
  </nav>
</header>
<main><section id='app'><div class="panel muted" style="text-align:center;padding:30px">⏳ Loading Explorer…</div></section></main>

<div id="modal-slot"></div>
<div id="toast">Copied to clipboard!</div>

<script>
const app = document.querySelector('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Global Safe Doc Lookup Cache
window.docMap = new Map();
window.currentDocsCache = [];

async function get(p) {
  try {
    const res = await fetch(p);
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);
    return await res.json();
  } catch (err) {
    console.error(`Fetch error for ${p}:`, err);
    throw err;
  }
}

function showToast(msg) {
  let t = document.querySelector('#toast');
  if (!t) return;
  t.innerText = msg;
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 2000);
}

function copyPath(e, path) {
  e.stopPropagation();
  navigator.clipboard.writeText(path);
  showToast('Copied: ' + path);
}

function getTokenBadge(tokens, lines) {
  let numTokens = Number(tokens) || 0;
  let lineStr = lines ? ` (${Number(lines).toLocaleString()} lines)` : '';
  if (numTokens >= 16000) return `<span class="badge badge-red">🔴 ${(numTokens/1000).toFixed(1)}k ${lineStr}</span>`;
  if (numTokens >= 8000) return `<span class="badge badge-purple">🟣 ${(numTokens/1000).toFixed(1)}k ${lineStr}</span>`;
  if (numTokens >= 6000) return `<span class="badge badge-orange">🟠 ${(numTokens/1000).toFixed(1)}k ${lineStr}</span>`;
  if (numTokens >= 4000) return `<span class="badge badge-yellow">🟡 ${(numTokens/1000).toFixed(1)}k ${lineStr}</span>`;
  if (numTokens >= 2000) return `<span class="badge badge-green">🟢 ${(numTokens/1000).toFixed(1)}k ${lineStr}</span>`;
  return `<span class="badge badge-muted" style="border-color:rgba(56,189,248,0.4);color:var(--accent)">🔵 ${numTokens} tok ${lineStr}</span>`;
}

function getAuthBadge(auth) {
  if (['constitutional','normative','canonical'].includes(auth)) return `<span class="badge badge-purple">${esc(auth)}</span>`;
  return `<span class="badge badge-muted">${esc(auth || 'file')}</span>`;
}

function cards(x) {
  let k = [
    ['documents','Documents'],['canonical_docs','Canonical'],['non_canonical_docs','Non-canonical'],
    ['estimated_tokens','Tokens'],['lines','Lines'],['symbols','Symbols'],
    ['code_mappings','Code mappings'],['links','Relations'],['broken_links','Broken links']
  ];
  return '<div class="grid">' + k.map(([a,b]) => `<div class="card"><span class="muted">${b}</span><b>${(x[a]??0).toLocaleString()}</b></div>`).join('') + '</div>';
}

async function overview() {
  let x = await get('/api/status');
  let rows = (x.largest_docs || []).map(r => `<tr><td><b>${esc(r.path)}</b></td><td>${getTokenBadge(r.estimated_tokens, r.lines)}</td><td>${getAuthBadge(r.authority)}</td></tr>`).join('');
  app.innerHTML = '<h2>Repository Health & Metrics</h2>' + cards(x) +
    '<div class="panel"><h3>Largest documents & modules</h3><table><thead><tr><th>Path</th><th>Tokens / Lines</th><th>Authority</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

let docState = { mode: 'folder', category: 'all', sizeFilter: 'all', langFilter: 'all', totalsOnly: false, filter: '', sort: 'tokens_desc', collapsedPaths: new Set() };

window.inspectFileByPath = function(path) {
  let doc = window.docMap.get(path);
  if (!doc) return;
  let isCode = doc.kind === 'code' || doc.kind === 'test' || doc.language;
  let tokens = Number(doc.estimated_tokens) || 0;
  let pct16 = Math.min(100, (tokens/16000)*100);
  let slot = document.querySelector('#modal-slot');
  slot.innerHTML = `
    <div class="modal-backdrop" onclick="document.querySelector('#modal-slot').innerHTML=''">
      <div class="modal-content" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="document.querySelector('#modal-slot').innerHTML=''">✕</button>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
          <span style="font-size:24px">${isCode ? '💻' : '📄'}</span>
          <div>
            <h3 style="margin:0;color:var(--heading)">${esc(doc.title || doc.path.split('/').pop())}</h3>
            <span class="muted" style="font-size:12px">${esc(doc.path)}</span>
          </div>
        </div>
        
        <div style="margin:16px 0">
          <div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:12px">
            <span class="muted">16K Context Scale</span>
            <b>${tokens.toLocaleString()} / 16,000 tokens (${pct16.toFixed(1)}%)</b>
          </div>
          <div class="bar"><i style="width:${pct16}%;background:${tokens>=16000?'var(--c-red)':tokens>=8000?'var(--c-purple)':tokens>=6000?'var(--c-orange)':tokens>=4000?'var(--c-yellow)':'var(--c-green)'}"></i></div>
        </div>

        <div class="grid" style="margin:16px 0">
          <div class="card"><span class="muted">Lines</span><b>${(Number(doc.lines)||0).toLocaleString()}</b></div>
          <div class="card"><span class="muted">Words</span><b>${(Number(doc.words)||0).toLocaleString()}</b></div>
          <div class="card"><span class="muted">Size</span><b>${((Number(doc.bytes)||0)/1024).toFixed(1)} KB</b></div>
          <div class="card"><span class="muted">Type</span><b>${esc(doc.language || doc.authority || doc.kind || 'file')}</b></div>
        </div>

        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button onclick="navigator.clipboard.writeText('${esc(doc.path)}');showToast('Path copied!');">📋 Copy Path</button>
        </div>
      </div>
    </div>
  `;
};

function buildFolderTree(docs) {
  let root = { name: 'Root', path: '', depth: 0, children: {}, files: [] };
  (docs || []).forEach(doc => {
    if (!doc || !doc.path) return;
    let parts = doc.path.split('/');
    let filename = parts.pop();
    let current = root;
    let currentPath = '';
    parts.forEach((part, i) => {
      currentPath = currentPath ? `${currentPath}/${part}` : part;
      if (!current.children[part]) {
        current.children[part] = {
          name: part,
          path: currentPath,
          depth: i + 1,
          children: {},
          files: []
        };
      }
      current = current.children[part];
    });
    current.files.push(doc);
  });
  return root;
}

function computeTreeStats(node) {
  let totTokens = node.files.reduce((a, x) => a + (Number(x.estimated_tokens) || 0), 0);
  let totFiles = node.files.length;
  let totLines = node.files.reduce((a, x) => a + (Number(x.lines) || 0), 0);
  
  let c16 = node.files.filter(x => (Number(x.estimated_tokens) || 0) >= 16000).length;
  let c8 = node.files.filter(x => (Number(x.estimated_tokens) || 0) >= 8000 && (Number(x.estimated_tokens) || 0) < 16000).length;
  let c6 = node.files.filter(x => (Number(x.estimated_tokens) || 0) >= 6000 && (Number(x.estimated_tokens) || 0) < 8000).length;
  let c4 = node.files.filter(x => (Number(x.estimated_tokens) || 0) >= 4000 && (Number(x.estimated_tokens) || 0) < 6000).length;
  let c2 = node.files.filter(x => (Number(x.estimated_tokens) || 0) >= 2000 && (Number(x.estimated_tokens) || 0) < 4000).length;
  let c0 = node.files.filter(x => (Number(x.estimated_tokens) || 0) < 2000).length;

  Object.values(node.children).forEach(child => {
    let cs = computeTreeStats(child);
    totTokens += cs.totTokens;
    totFiles += cs.totFiles;
    totLines += cs.totLines;
    c16 += cs.c16;
    c8 += cs.c8;
    c6 += cs.c6;
    c4 += cs.c4;
    c2 += cs.c2;
    c0 += cs.c0;
  });

  node.stats = {
    totTokens, totFiles, totLines, c16, c8, c6, c4, c2, c0,
    has16k: c16 > 0,
    has8k: (c16 + c8) > 0
  };
  return node.stats;
}

function renderTreeNode(node) {
  let childKeys = Object.keys(node.children);
  childKeys.sort((a,b) => {
    let sumA = node.children[a].stats.totTokens;
    let sumB = node.children[b].stats.totTokens;
    if (docState.sort === 'tokens_desc') return sumB - sumA;
    if (docState.sort === 'tokens_asc') return sumA - sumB;
    if (docState.sort === 'files_desc') return node.children[b].stats.totFiles - node.children[a].stats.totFiles;
    return a.localeCompare(b);
  });

  let files = [...node.files];
  files.sort((x,y) => (Number(y.estimated_tokens)||0) - (Number(x.estimated_tokens)||0));

  let isCollapsed = docState.collapsedPaths.has(node.path);
  let st = node.stats || { totTokens: 0, totFiles: 0, totLines: 0, c16:0, c8:0, c6:0, c4:0, c2:0, c0:0 };
  let totalItems = st.totFiles || 1;
  let p16 = (st.c16/totalItems)*100;
  let p8 = (st.c8/totalItems)*100;
  let p6 = (st.c6/totalItems)*100;
  let p4 = (st.c4/totalItems)*100;
  let p2 = (st.c2/totalItems)*100;
  let p0 = (st.c0/totalItems)*100;

  let html = '';
  
  if (node.depth > 0) {
    html += `
      <div class="folder-node">
        <div class="folder-card ${st.has16k?'has-32k':''}">
          <div class="folder-header" onclick="toggleFolder('${esc(node.path)}')">
            <div class="folder-title">
              <span class="arrow-icon">${isCollapsed ? '▶' : '▼'}</span>
              <span>📁 <b>${esc(node.name)}</b></span>
              <span class="muted" style="font-size:11px">(${esc(node.path)})</span>
              <span class="badge badge-muted">${st.totFiles} file${st.totFiles>1?'s':''}</span>
              ${st.has16k ? `<span class="badge badge-red">⚠️ ${st.c16} Heavy File${st.c16>1?'s':''} (&ge;16K)</span>` : st.has8k ? `<span class="badge badge-purple">🟣 ${st.c8} Large File${st.c8>1?'s':''} (8K–16K)</span>` : ''}
            </div>
            <div class="folder-meta">
              <div class="distribution-bar" title="≥16K: ${st.c16}, 8K-16K: ${st.c8}, 6K-8K: ${st.c6}, 4K-6K: ${st.c4}, 2K-4K: ${st.c2}, <2K: ${st.c0}">
                <span style="width:${p16}%;background:var(--c-red)"></span>
                <span style="width:${p8}%;background:var(--c-purple)"></span>
                <span style="width:${p6}%;background:var(--c-orange)"></span>
                <span style="width:${p4}%;background:var(--c-yellow)"></span>
                <span style="width:${p2}%;background:var(--c-green)"></span>
                <span style="width:${p0}%;background:var(--accent)"></span>
              </div>
              <span class="badge badge-purple">${st.totTokens.toLocaleString()} tokens</span>
              <span class="muted" style="font-size:12px">${st.totLines.toLocaleString()} lines</span>
            </div>
          </div>
          ${(!isCollapsed) ? `
            <div class="folder-children">
              ${childKeys.map(k => renderTreeNode(node.children[k])).join('')}
              ${(!docState.totalsOnly && files.length > 0) ? `
                <div class="file-grid">
                  ${files.map(doc => {
                    let isHeavy = (Number(doc.estimated_tokens)||0) >= 16000;
                    let isCode = doc.kind === 'code' || doc.kind === 'test' || doc.language;
                    let icon = isCode ? '💻' : '📄';
                    let typeBadge = doc.language ? `<span class="badge badge-purple">${esc(doc.language)}</span>` : getAuthBadge(doc.authority);
                    return `
                      <div class="file-card ${isHeavy?'is-32k':''}" onclick="window.inspectFileByPath('${esc(doc.path)}')">
                        <div class="file-card-top">
                          <div class="file-path">${icon} ${esc(doc.path.split('/').pop())}</div>
                          <button class="copy-btn" onclick="copyPath(event, '${esc(doc.path)}')">📋</button>
                        </div>
                        <div class="muted" style="font-size:11px;word-break:break-all">${esc(doc.path)}</div>
                        <div class="file-meta-row">
                          ${getTokenBadge(doc.estimated_tokens||0, doc.lines)}
                          ${typeBadge}
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              ` : ''}
            </div>
          ` : ''}
        </div>
      </div>
    `;
  } else {
    // Root node
    html += childKeys.map(k => renderTreeNode(node.children[k])).join('');
    if (!docState.totalsOnly && files.length > 0) {
      html += `
        <div class="folder-card" style="margin-top:8px">
          <div class="folder-header" onclick="toggleFolder('__root__')">
            <div class="folder-title">
              <span class="arrow-icon">${docState.collapsedPaths.has('__root__') ? '▶' : '▼'}</span>
              <span>📁 <b>[Root Level Files]</b></span>
              <span class="badge badge-muted">${files.length} files</span>
            </div>
          </div>
          ${!docState.collapsedPaths.has('__root__') ? `
            <div class="folder-children">
              <div class="file-grid">
                ${files.map(doc => {
                  let isHeavy = (Number(doc.estimated_tokens)||0) >= 16000;
                  let isCode = doc.kind === 'code' || doc.kind === 'test' || doc.language;
                  let icon = isCode ? '💻' : '📄';
                  let typeBadge = doc.language ? `<span class="badge badge-purple">${esc(doc.language)}</span>` : getAuthBadge(doc.authority);
                  return `
                    <div class="file-card ${isHeavy?'is-32k':''}" onclick="window.inspectFileByPath('${esc(doc.path)}')">
                      <div class="file-card-top">
                        <div class="file-path">${icon} ${esc(doc.path.split('/').pop())}</div>
                        <button class="copy-btn" onclick="copyPath(event, '${esc(doc.path)}')">📋</button>
                      </div>
                      <div class="muted" style="font-size:11px;word-break:break-all">${esc(doc.path)}</div>
                      <div class="file-meta-row">
                        ${getTokenBadge(doc.estimated_tokens||0, doc.lines)}
                        ${typeBadge}
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }
  }
  return html;
}

window.toggleFolder = function(path) {
  if (docState.collapsedPaths.has(path)) {
    docState.collapsedPaths.delete(path);
  } else {
    docState.collapsedPaths.add(path);
  }
  if (window.renderDocsView) window.renderDocsView();
};

async function documents() {
  try {
    window.currentDocsCache = await get('/api/documents');
    window.docMap.clear();
    window.currentDocsCache.forEach(d => {
      if (d && d.path) window.docMap.set(d.path, d);
    });
  } catch (err) {
    app.innerHTML = `
      <div class="panel" style="border-color:var(--c-red);background:rgba(255,123,114,0.08)">
        <h3 style="color:var(--c-red);margin-top:0">⚠️ Unable to fetch documents from server</h3>
        <p class="muted">${esc(err.message || String(err))}</p>
        <button onclick="documents()">🔄 Retry</button>
      </div>
    `;
    return;
  }
  
  window.renderDocsView = function() {
    try {
      let q = (docState.filter || '').toLowerCase().trim();
      let filtered = (window.currentDocsCache || []).filter(d => {
        if (!d || !d.path) return false;
        let isCode = d.kind === 'code' || d.kind === 'test' || d.language;
        if (docState.category === 'docs' && isCode) return false;
        if (docState.category === 'code' && !isCode) return false;
        
        let tokens = Number(d.estimated_tokens) || 0;
        if (docState.sizeFilter === '16k' && tokens < 16000) return false;
        if (docState.sizeFilter === '8k_16k' && (tokens < 8000 || tokens >= 16000)) return false;
        if (docState.sizeFilter === '6k_8k' && (tokens < 6000 || tokens >= 8000)) return false;
        if (docState.sizeFilter === '4k_6k' && (tokens < 4000 || tokens >= 6000)) return false;
        if (docState.sizeFilter === '2k_4k' && (tokens < 2000 || tokens >= 4000)) return false;
        if (docState.sizeFilter === 'small' && tokens >= 2000) return false;

        if (docState.langFilter === 'py') {
          let isPy = d.path.endsWith('.py') || d.language === 'Python';
          if (!isPy) return false;
        } else if (docState.langFilter === 'js_ts') {
          let isJsTs = d.path.endsWith('.js') || d.path.endsWith('.ts') || d.path.endsWith('.tsx') || d.path.endsWith('.jsx');
          if (!isJsTs) return false;
        } else if (docState.langFilter === 'md') {
          let isMd = d.path.endsWith('.md') || d.path.endsWith('.rst') || d.path.endsWith('.mdx');
          if (!isMd) return false;
        }

        return !q || d.path.toLowerCase().includes(q) || (d.title && String(d.title).toLowerCase().includes(q)) || (d.canonical_id && String(d.canonical_id).toLowerCase().includes(q));
      });

      let totalTokens = filtered.reduce((a,b) => a + (Number(b.estimated_tokens)||0), 0);
      let total16k = filtered.filter(b => (Number(b.estimated_tokens)||0) >= 16000).length;
      let total8k = filtered.filter(b => (Number(b.estimated_tokens)||0) >= 8000 && (Number(b.estimated_tokens)||0) < 16000).length;

      let tree = buildFolderTree(filtered);
      computeTreeStats(tree);

      let html = `
        <div class="stats-banner">
          <span>Showing: <b>${filtered.length}</b> files</span>
          <span>Total Tokens: <b>${totalTokens.toLocaleString()}</b></span>
          <span>Avg per File: <b>${filtered.length ? Math.round(totalTokens/filtered.length).toLocaleString() : 0}</b></span>
          ${total16k ? `<span style="color:var(--c-red)">🔴 <b>${total16k}</b> &ge;16K files</span>` : ''}
          ${total8k ? `<span style="color:var(--c-purple)">🟣 <b>${total8k}</b> 8K–16K files</span>` : ''}
          ${(!total16k && !total8k) ? '<span style="color:var(--c-green)">✓ Compact / Modular codebase (&lt;8K)</span>' : ''}
        </div>

        <div class="toolbar">
          <input id="doc-search" class="search-box" placeholder="Filter files or folder paths..." value="${esc(docState.filter)}" autofocus>
          
          <div class="btn-group">
            <button id="btn-cat-all" class="${docState.category==='all'?'active':''}">📚 All</button>
            <button id="btn-cat-docs" class="${docState.category==='docs'?'active':''}">📄 Docs</button>
            <button id="btn-cat-code" class="${docState.category==='code'?'active':''}">💻 Code</button>
          </div>

          <select id="doc-lang-filter">
            <option value="all" ${docState.langFilter==='all'?'selected':''}>All Formats</option>
            <option value="py" ${docState.langFilter==='py'?'selected':''}>🐍 Python (.py)</option>
            <option value="js_ts" ${docState.langFilter==='js_ts'?'selected':''}>⚡ JS / TS (.js, .ts)</option>
            <option value="md" ${docState.langFilter==='md'?'selected':''}>📝 Markdown (.md)</option>
          </select>

          <select id="doc-size-filter">
            <option value="all" ${docState.sizeFilter==='all'?'selected':''}>All Sizes</option>
            <option value="16k" ${docState.sizeFilter==='16k'?'selected':''}>🔴 &ge; 16K (Heavy)</option>
            <option value="8k_16k" ${docState.sizeFilter==='8k_16k'?'selected':''}>🟣 8K – 16K (Large)</option>
            <option value="6k_8k" ${docState.sizeFilter==='6k_8k'?'selected':''}>🟠 6K – 8K (Medium-High)</option>
            <option value="4k_6k" ${docState.sizeFilter==='4k_6k'?'selected':''}>🟡 4K – 6K (Moderate)</option>
            <option value="2k_4k" ${docState.sizeFilter==='2k_4k'?'selected':''}>🟢 2K – 4K (Standard)</option>
            <option value="small" ${docState.sizeFilter==='small'?'selected':''}>🔵 &lt; 2K (Compact)</option>
          </select>

          <div class="btn-group">
            <button id="btn-mode-folder" class="${docState.mode==='folder'?'active':''}">📁 Tree Grid</button>
            <button id="btn-mode-flat" class="${docState.mode==='flat'?'active':''}">📄 Flat List</button>
          </div>

          <button id="btn-expand-all">▼ Expand All</button>
          <button id="btn-collapse-all">▶ Collapse All</button>
          <button id="btn-rescan" style="border-color:var(--accent);color:var(--accent)">🔄 Rescan</button>

          <label class="toggle-label">
            <input type="checkbox" id="chk-totals-only" ${docState.totalsOnly ? 'checked' : ''}>
            <span>Totals Only</span>
          </label>

          <select id="doc-sort">
            <option value="tokens_desc" ${docState.sort==='tokens_desc'?'selected':''}>Sort by Size/Tokens (High → Low)</option>
            <option value="lines_desc" ${docState.sort==='lines_desc'?'selected':''}>Sort by Lines (High → Low)</option>
            <option value="tokens_asc" ${docState.sort==='tokens_asc'?'selected':''}>Sort by Size/Tokens (Low → High)</option>
            <option value="files_desc" ${docState.sort==='files_desc'?'selected':''}>Sort by File Count</option>
            <option value="name_asc" ${docState.sort==='name_asc'?'selected':''}>Sort by Name</option>
          </select>
        </div>
      `;

      if (docState.mode === 'folder') {
        html += '<div class="tree-container">';
        let treeHtml = renderTreeNode(tree);
        if (!treeHtml.trim()) {
          html += '<div class="panel muted">No files matching current filter criteria.</div>';
        } else {
          html += treeHtml;
        }
        html += '</div>';
      } else {
        let flatFiles = [...filtered];
        if (docState.sort === 'tokens_desc') flatFiles.sort((a,b) => (Number(b.estimated_tokens)||0) - (Number(a.estimated_tokens)||0));
        if (docState.sort === 'lines_desc') flatFiles.sort((a,b) => (Number(b.lines)||0) - (Number(a.lines)||0));
        if (docState.sort === 'tokens_asc') flatFiles.sort((a,b) => (Number(a.estimated_tokens)||0) - (Number(b.estimated_tokens)||0));
        if (docState.sort === 'name_asc') flatFiles.sort((a,b) => String(a.path).localeCompare(String(b.path)));

        html += `
          <div class="panel">
            <table>
              <thead>
                <tr><th>Path</th><th>Tokens / Lines</th><th>Type / Language</th><th>Lines</th><th>Bytes</th></tr>
              </thead>
              <tbody>
                ${flatFiles.map(d => {
                  let isCode = d.kind === 'code' || d.kind === 'test' || d.language;
                  let icon = isCode ? '💻' : '📄';
                  let typeBadge = d.language ? `<span class="badge badge-purple">${esc(d.language)}</span>` : getAuthBadge(d.authority);
                  return `
                    <tr style="${(Number(d.estimated_tokens)||0)>=16000?'background:rgba(255,123,114,0.08)':''};cursor:pointer" onclick="window.inspectFileByPath('${esc(d.path)}')">
                      <td>${icon} <b>${esc(d.path)}</b></td>
                      <td>${getTokenBadge(d.estimated_tokens||0, d.lines)}</td>
                      <td>${typeBadge}</td>
                      <td>${(Number(d.lines)||0).toLocaleString()}</td>
                      <td>${(Number(d.bytes)||0).toLocaleString()}</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;
      }

      app.innerHTML = html;

      // Listeners
      const on = (sel, ev, fn) => { let el = document.querySelector(sel); if (el) el[ev] = fn; };
      on('#doc-search', 'oninput', e => { docState.filter = e.target.value; window.renderDocsView(); });
      on('#btn-cat-all', 'onclick', () => { docState.category = 'all'; window.renderDocsView(); });
      on('#btn-cat-docs', 'onclick', () => { docState.category = 'docs'; window.renderDocsView(); });
      on('#btn-cat-code', 'onclick', () => { docState.category = 'code'; window.renderDocsView(); });
      on('#doc-lang-filter', 'onchange', e => { docState.langFilter = e.target.value; window.renderDocsView(); });
      on('#doc-size-filter', 'onchange', e => { docState.sizeFilter = e.target.value; window.renderDocsView(); });

      on('#btn-mode-folder', 'onclick', () => { docState.mode = 'folder'; window.renderDocsView(); });
      on('#btn-mode-flat', 'onclick', () => { docState.mode = 'flat'; window.renderDocsView(); });
      on('#chk-totals-only', 'onchange', e => { docState.totalsOnly = e.target.checked; window.renderDocsView(); });
      on('#doc-sort', 'onchange', e => { docState.sort = e.target.value; window.renderDocsView(); });
      
      on('#btn-expand-all', 'onclick', () => {
        docState.collapsedPaths.clear();
        window.renderDocsView();
      });
      on('#btn-collapse-all', 'onclick', () => {
        function collectPaths(n) {
          if (n && n.path) docState.collapsedPaths.add(n.path);
          if (n && n.children) Object.values(n.children).forEach(collectPaths);
        }
        collectPaths(tree);
        docState.collapsedPaths.add('__root__');
        window.renderDocsView();
      });
      on('#btn-rescan', 'onclick', async () => {
        let btn = document.querySelector('#btn-rescan');
        if (btn) btn.innerText = '⏳ Rescanning...';
        try {
          await get('/api/rescan');
          window.currentDocsCache = await get('/api/documents');
          window.docMap.clear();
          window.currentDocsCache.forEach(d => { if (d && d.path) window.docMap.set(d.path, d); });
          window.renderDocsView();
          showToast('Repository rescanned and refreshed!');
        } catch (err) {
          showToast('Rescan failed: ' + err.message);
          if (btn) btn.innerText = '🔄 Rescan';
        }
      });
    } catch (renderErr) {
      console.error('Render error:', renderErr);
      app.innerHTML = `
        <div class="panel" style="border-color:var(--c-red);background:rgba(255,123,114,0.08)">
          <h3 style="color:var(--c-red);margin-top:0">⚠️ Rendering error</h3>
          <p class="muted">${esc(renderErr.message || String(renderErr))}</p>
          <button onclick="documents()">🔄 Reset & Reload</button>
        </div>
      `;
    }
  };

  window.renderDocsView();
}

let graphAnimFrame = null;
let selectedGraphNode = null;

async function graph() {
  if (graphAnimFrame) cancelAnimationFrame(graphAnimFrame);
  let rawRelations = await get('/api/relations');
  let relations = (rawRelations || []).filter(r => r && r.source && r.target && r.source !== r.target);

  let nodeMap = {};
  relations.forEach(r => {
    if (!nodeMap[r.source]) nodeMap[r.source] = { id: r.source, in: 0, out: 0, neighbors: new Set() };
    if (!nodeMap[r.target]) nodeMap[r.target] = { id: r.target, in: 0, out: 0, neighbors: new Set() };
    nodeMap[r.source].out++;
    nodeMap[r.target].in++;
    nodeMap[r.source].neighbors.add(r.target);
    nodeMap[r.target].neighbors.add(r.source);
  });

  let nodes = Object.values(nodeMap);
  let topHubs = [...nodes].sort((a,b) => b.in - a.in).slice(0, 6);

  let html = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:12px">
      <div>
        <h2 style="margin:0">Interactive Knowledge & Dependency Graph</h2>
        <span class="muted">Visual mapping of cross-document references, normative specs, and architecture links (${nodes.length} nodes · ${relations.length} relations).</span>
      </div>
      <div class="btn-group">
        <button id="btn-graph-visual" class="active">🪐 Visual Network</button>
        <button id="btn-graph-table">📋 Raw Table</button>
      </div>
    </div>

    <div id="graph-view-visual" style="display:grid;grid-template-columns:1fr 340px;gap:14px;align-items:start">
      <div style="background:var(--panel);border:1px solid var(--border);border-radius:8px;position:relative;overflow:hidden;height:650px;display:flex;flex-direction:column">
        <div style="position:absolute;top:12px;left:12px;z-index:10;display:flex;gap:8px;align-items:center;background:rgba(20,27,38,0.85);padding:6px 10px;border-radius:6px;border:1px solid var(--border);backdrop-filter:blur(4px)">
          <input id="graph-search" placeholder="Find node in graph..." style="padding:4px 8px;font-size:12px;width:180px">
          <button id="btn-reset-graph" style="padding:4px 8px;font-size:12px">Reset View</button>
          <span class="muted" style="font-size:11px">💡 Drag nodes to rearrange</span>
        </div>
        <canvas id="graph-canvas" style="flex:1;width:100%;height:100%;cursor:grab"></canvas>
      </div>

      <div style="display:flex;flex-direction:column;gap:14px">
        <div class="card" style="padding:14px" id="node-inspector-card">
          <h3 style="margin:0 0 8px 0;font-size:15px;color:var(--heading)">Node Inspector</h3>
          <p class="muted" style="font-size:13px;margin:0">Click any node on the canvas to inspect its upstream dependencies and downstream dependents.</p>
        </div>

        <div class="card" style="padding:14px">
          <h3 style="margin:0 0 10px 0;font-size:14px;color:var(--heading)">Top Knowledge Hubs (Most Referenced)</h3>
          <div style="display:flex;flex-direction:column;gap:6px">
            ${topHubs.map(h => `
              <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:var(--panel-sub);border-radius:6px;cursor:pointer" onclick="selectGraphNode('${esc(h.id)}')">
                <b style="font-size:12px;color:var(--heading);word-break:break-all">${esc(h.id)}</b>
                <span class="badge badge-purple">${h.in} citations</span>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    </div>

    <div id="graph-view-table" class="panel" style="display:none">
      <table>
        <thead><tr><th>Source</th><th>Kind</th><th>Target</th><th>Evidence</th></tr></thead>
        <tbody>
          ${relations.map(r => `<tr><td><b>${esc(r.source)}</b></td><td><span class="badge badge-purple">${esc(r.kind)}</span></td><td><b>${esc(r.target)}</b></td><td>${esc(r.evidence)}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;

  app.innerHTML = html;

  document.querySelector('#btn-graph-visual').onclick = () => {
    document.querySelector('#btn-graph-visual').classList.add('active');
    document.querySelector('#btn-graph-table').classList.remove('active');
    document.querySelector('#graph-view-visual').style.display = 'grid';
    document.querySelector('#graph-view-table').style.display = 'none';
  };
  document.querySelector('#btn-graph-table').onclick = () => {
    document.querySelector('#btn-graph-table').classList.add('active');
    document.querySelector('#btn-graph-visual').classList.remove('active');
    document.querySelector('#graph-view-visual').style.display = 'none';
    document.querySelector('#graph-view-table').style.display = 'block';
  };

  const canvas = document.querySelector('#graph-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  
  function resize() {
    canvas.width = canvas.parentElement.clientWidth * window.devicePixelRatio;
    canvas.height = canvas.parentElement.clientHeight * window.devicePixelRatio;
    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  }
  resize();
  window.onresize = resize;

  let W = canvas.parentElement.clientWidth;
  let H = canvas.parentElement.clientHeight;

  nodes.forEach((n, i) => {
    let angle = (i / nodes.length) * Math.PI * 2;
    let radius = 180 + Math.random() * 80;
    n.x = W / 2 + Math.cos(angle) * radius;
    n.y = H / 2 + Math.sin(angle) * radius;
    n.vx = 0;
    n.vy = 0;
    n.r = Math.min(18, 7 + (n.in + n.out) * 1.2);
  });

  let draggedNode = null;
  let hoveredNode = null;

  function getNodeColor(n) {
    if (n.id.includes('vision') || n.id.includes('agents') || n.id.includes('law')) return '#bc8cff';
    if (n.id.includes('spec') || n.id.includes('decision')) return '#38bdf8';
    if (n.id.includes('arch') || n.id.includes('backend')) return '#56d364';
    return '#ffa657';
  }

  function updateInspector(node) {
    selectedGraphNode = node;
    let card = document.querySelector('#node-inspector-card');
    if (!node) {
      card.innerHTML = '<h3 style="margin:0 0 8px 0;font-size:15px;color:var(--heading)">Node Inspector</h3><p class="muted" style="font-size:13px;margin:0">Click any node on the canvas to inspect its dependencies.</p>';
      return;
    }
    let incoming = relations.filter(r => r.target === node.id);
    let outgoing = relations.filter(r => r.source === node.id);

    card.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px">
        <h3 style="margin:0;font-size:14px;color:var(--heading);word-break:break-all">🪐 ${esc(node.id)}</h3>
        <button class="copy-btn" onclick="navigator.clipboard.writeText('${esc(node.id)}');showToast('Copied ID!');">📋</button>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <span class="badge badge-purple">${incoming.length} incoming references</span>
        <span class="badge badge-muted">${outgoing.length} outgoing links</span>
      </div>

      <b style="font-size:12px;color:var(--muted)">Referenced By (Dependents):</b>
      <div style="max-height:120px;overflow-y:auto;margin:4px 0 10px 0;display:flex;flex-direction:column;gap:4px">
        ${incoming.length ? incoming.map(r => `<div style="font-size:11px;background:var(--panel-sub);padding:4px 6px;border-radius:4px;cursor:pointer" onclick="selectGraphNode('${esc(r.source)}')">↳ ${esc(r.source)}</div>`).join('') : '<span class="muted" style="font-size:11px">None</span>'}
      </div>

      <b style="font-size:12px;color:var(--muted)">Depends On (References):</b>
      <div style="max-height:120px;overflow-y:auto;margin:4px 0;display:flex;flex-direction:column;gap:4px">
        ${outgoing.length ? outgoing.map(r => `<div style="font-size:11px;background:var(--panel-sub);padding:4px 6px;border-radius:4px;cursor:pointer" onclick="selectGraphNode('${esc(r.target)}')">→ ${esc(r.target)}</div>`).join('') : '<span class="muted" style="font-size:11px">None</span>'}
      </div>
    `;
  }

  window.selectGraphNode = function(id) {
    let target = nodeMap[id];
    if (target) updateInspector(target);
  };

  function simulate() {
    W = canvas.parentElement.clientWidth;
    H = canvas.parentElement.clientHeight;

    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        let a = nodes[i], b = nodes[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        let dist = Math.sqrt(dx * dx + dy * dy) || 1;
        if (dist < 260) {
          let force = (260 - dist) / dist * 0.12;
          a.vx -= dx * force;
          a.vy -= dy * force;
          b.vx += dx * force;
          b.vy += dy * force;
        }
      }
    }

    relations.forEach(r => {
      let a = nodeMap[r.source], b = nodeMap[r.target];
      if (!a || !b) return;
      let dx = b.x - a.x, dy = b.y - a.y;
      let dist = Math.sqrt(dx * dx + dy * dy) || 1;
      let targetDist = 90;
      let force = (dist - targetDist) * 0.008;
      a.vx += (dx / dist) * force;
      a.vy += (dy / dist) * force;
      b.vx -= (dx / dist) * force;
      b.vy -= (dy / dist) * force;
    });

    nodes.forEach(n => {
      if (n === draggedNode) return;
      n.vx += (W / 2 - n.x) * 0.002;
      n.vy += (H / 2 - n.y) * 0.002;
      n.vx *= 0.88;
      n.vy *= 0.88;
      n.x += n.vx;
      n.y += n.vy;
    });
  }

  function draw() {
    simulate();
    ctx.clearRect(0, 0, W, H);

    relations.forEach(r => {
      let a = nodeMap[r.source], b = nodeMap[r.target];
      if (!a || !b) return;
      let isHighlighted = selectedGraphNode && (a.id === selectedGraphNode.id || b.id === selectedGraphNode.id);
      
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = isHighlighted ? '#38bdf8' : 'rgba(42, 54, 79, 0.6)';
      ctx.lineWidth = isHighlighted ? 2.2 : 1;
      ctx.stroke();

      if (isHighlighted || (hoveredNode && (a.id === hoveredNode.id || b.id === hoveredNode.id))) {
        let dx = b.x - a.x, dy = b.y - a.y;
        let dist = Math.sqrt(dx * dx + dy * dy) || 1;
        let arrowX = b.x - (dx / dist) * (b.r + 4);
        let arrowY = b.y - (dy / dist) * (b.r + 4);
        let angle = Math.atan2(dy, dx);
        ctx.fillStyle = isHighlighted ? '#38bdf8' : 'rgba(139, 148, 158, 0.8)';
        ctx.beginPath();
        ctx.moveTo(arrowX, arrowY);
        ctx.lineTo(arrowX - 8 * Math.cos(angle - Math.PI / 6), arrowY - 8 * Math.sin(angle - Math.PI / 6));
        ctx.lineTo(arrowX - 8 * Math.cos(angle + Math.PI / 6), arrowY - 8 * Math.sin(angle + Math.PI / 6));
        ctx.fill();
      }
    });

    nodes.forEach(n => {
      let isSel = selectedGraphNode && n.id === selectedGraphNode.id;
      let isNeighbor = selectedGraphNode && selectedGraphNode.neighbors.has(n.id);
      let isHover = hoveredNode && n.id === hoveredNode.id;

      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r + (isSel ? 4 : 0), 0, Math.PI * 2);
      ctx.fillStyle = getNodeColor(n);
      ctx.fill();

      if (isSel || isHover) {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.stroke();
      } else if (isNeighbor) {
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      ctx.font = isSel ? 'bold 12px sans-serif' : '10px sans-serif';
      ctx.fillStyle = isSel ? '#ffffff' : 'rgba(230, 237, 243, 0.85)';
      ctx.textAlign = 'center';
      ctx.fillText(n.id.length > 18 ? n.id.slice(0, 16) + '…' : n.id, n.x, n.y + n.r + 13);
    });

    graphAnimFrame = requestAnimationFrame(draw);
  }

  draw();

  function getNodeAt(x, y) {
    return nodes.find(n => {
      let dx = n.x - x, dy = n.y - y;
      return Math.sqrt(dx * dx + dy * dy) <= n.r + 5;
    });
  }

  canvas.onmousedown = e => {
    let rect = canvas.getBoundingClientRect();
    let x = e.clientX - rect.left, y = e.clientY - rect.top;
    let hit = getNodeAt(x, y);
    if (hit) {
      draggedNode = hit;
      updateInspector(hit);
    } else {
      updateInspector(null);
    }
  };

  canvas.onmousemove = e => {
    let rect = canvas.getBoundingClientRect();
    let x = e.clientX - rect.left, y = e.clientY - rect.top;
    if (draggedNode) {
      draggedNode.x = x;
      draggedNode.y = y;
      draggedNode.vx = 0;
      draggedNode.vy = 0;
    } else {
      hoveredNode = getNodeAt(x, y);
      canvas.style.cursor = hoveredNode ? 'pointer' : 'grab';
    }
  };

  window.onmouseup = () => { draggedNode = null; };

  document.querySelector('#graph-search').oninput = e => {
    let q = e.target.value.toLowerCase().trim();
    if (!q) return;
    let found = nodes.find(n => n.id.toLowerCase().includes(q));
    if (found) updateInspector(found);
  };

  document.querySelector('#btn-reset-graph').onclick = () => {
    nodes.forEach((n, i) => {
      let angle = (i / nodes.length) * Math.PI * 2;
      let radius = 180 + Math.random() * 80;
      n.x = W / 2 + Math.cos(angle) * radius;
      n.y = H / 2 + Math.sin(angle) * radius;
      n.vx = 0;
      n.vy = 0;
    });
  };
}

async function quality() {
  let x = await get('/api/status');
  app.innerHTML = '<h2>Metadata & Repository Quality</h2>' + cards(x) + '<div class="panel">Heavy validators remain delegated to the repository canonical checks.</div>';
}

async function providers() {
  let x = await get('/api/providers');
  let rows = (x || []).map(r => `<tr><td><b>${esc(r.provider)}</b></td><td>${r.status==='AVAILABLE'?'<span class="badge badge-green">AVAILABLE</span>':'<span class="badge badge-red">ERROR</span>'}</td><td>${r.diagnostics}</td></tr>`).join('');
  app.innerHTML = '<h2>Providers</h2><div class="panel"><table><thead><tr><th>Provider</th><th>Status</th><th>Diagnostics</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

async function view(v = 'documents') {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  app.innerHTML = '<div class="panel muted" style="text-align:center;padding:40px">⏳ Loading ' + esc(v) + '…</div>';
  try {
    const views = { overview, documents, context, graph, quality, providers };
    await (views[v] || documents)();
  } catch (err) {
    console.error('View error:', err);
    app.innerHTML = `
      <div class="panel" style="border-color:var(--c-red);background:rgba(255,123,114,0.08)">
        <h3 style="color:var(--c-red);margin-top:0">⚠️ Error loading view (${esc(v)})</h3>
        <p class="muted">${esc(err.message || String(err))}</p>
        <button onclick="view('${esc(v)}')">🔄 Retry</button>
      </div>
    `;
  }
}

document.querySelectorAll('button[data-view]').forEach(b => b.onclick = () => view(b.dataset.view));
view('documents');
</script>
