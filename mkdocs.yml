site_name: AETHER Documentation
site_description: General Event-Sourced Agentic Computation Framework & Substrate
site_author: AETHER Team

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [vanguard/packages]
          options:
            show_root_heading: true
            show_source: true

validation:
  nav:
    omitted_files: info
  links:
    absolute_links: relative_to_docs
    unrecognized_links: ignore
    not_found: ignore

docs_dir: docs

nav:
  - Home: README.md
  - Overview:
      - System Overview: architecture/overview.md
      - System Boundaries: architecture/boundaries.md
      - Data Flow: architecture/data-flow.md
      - Decisions Index: decisions.md
  - Architecture:
      - Workflows:
          - End-to-End Execution: architecture/workflows/end-to-end-execution.md
          - System Bootstrap: architecture/workflows/system-bootstrap.md
  - Backend:
      - Delegation & Topology: backend/architecture/delegation-topology.md
      - Workflows:
          - Request Execution: backend/architecture/workflows/request-execution.md
          - Agent Lifecycle: backend/architecture/workflows/agent-lifecycle.md
          - Event Lifecycle: backend/architecture/workflows/event-lifecycle.md
          - Delegation: backend/architecture/workflows/delegation.md
          - Recovery & Resume: backend/architecture/workflows/recovery-resume.md
      - Reference:
          - Schemas: backend/reference/schemas.md
          - Runtime Service: backend/reference/runtime-service.md
          - Port Contracts: backend/reference/ports.md
          - Python API Reference: backend/reference/api-ports.md
          - Commands: backend/reference/commands.md
          - Events: backend/reference/events.md
          - Manifests: backend/reference/manifests.md
          - Configuration: backend/reference/configuration.md
          - Artifacts & Memory: backend/reference/artifacts-memory.md
  - Execution:
      - Active Execution: execution/active.md
      - Milestones: execution/milestones.md
  - Theory & Reports:
      - Theory: theory/agent-substrate.md
      - Atlas Control Plane Report: atlas/AETHER_DOCUMENTATION_CONTROL_PLANE_AND_ATLAS_OSS_EVOLUTION_REPORT.md
