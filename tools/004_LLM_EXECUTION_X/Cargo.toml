[package]
name = "lex"
version = "1.0.0"
edition = "2021"
authors = ["AI Agentic Architecture Group"]
description = "Local Execution X-engine: Autonomous Multi-Model Coding Swarm & Evidentiary Synthesis"

[lib]
name = "lex"
path = "src/lib.rs"

[[bin]]
name = "lex"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
clap = { version = "4.5", features = ["derive"] }
async-trait = "0.1"
tempfile = "3.10"

[dev-dependencies]
tokio-test = "0.4"
