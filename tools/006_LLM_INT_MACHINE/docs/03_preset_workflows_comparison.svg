      <text x="35" y="215" fill="#58a6ff" font-size="13" font-weight="bold">Empirical Performance Metrics:</text>
      <text x="35" y="240" fill="#f0f6fc" font-size="11">• Mean Turns to Resolve: <tspan fill="#58a6ff">4.0 – 7.0 turns</tspan></text>
      <text x="35" y="260" fill="#f0f6fc" font-size="11">• SWE-Bench Verified: <tspan fill="#58a6ff">53.8% ± 3.5%</tspan></text>
      <text x="35" y="280" fill="#f0f6fc" font-size="11">• SWE-Bench Pro (Hard): <tspan fill="#58a6ff">28.0% ± 4.0%</tspan></text>
      <text x="35" y="300" fill="#f0f6fc" font-size="11">• Mean Cost / Solved Task: <tspan fill="#3fb950">$0.00060 USD</tspan></text>
      <text x="35" y="320" fill="#f0f6fc" font-size="11">• Hardware KV-Cache Hit: <tspan fill="#3fb950">72.5% Rate</tspan></text>
    </g>

