api: mhf.plugin/1
id: mhf.toolkit.formal-graph-coloring-witness
version: 1.0.0
provides:
  - spi: IToolkit
    spi_version: ">=1.0,<2"
requires: []
isolation: container
capabilities:
  - verb: fs.read
    selector:
      kind: fs
      root: /workspace
      paths:
        - /workspace
  - verb: patch.apply
    selector:
      kind: fs
      root: /workspace
      paths:
        - /workspace
  - verb: proc.exec
    selector:
      kind: generic
      uriPattern: proc://exec/allow/python3
entry: toolkits/witness.py:GraphColoringWitnessToolkit
