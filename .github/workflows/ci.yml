name: vanguard-ci

on:
  push:
    branches: [main, feat/*, feat_*, sprint*]
  pull_request:

permissions:
  contents: read

jobs:
  vanguard-living-gates:
    name: Living Gates — Packages Lattice, Boundaries, TCB, Links, Secrets (Linux)
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ""
      DEEPSEEK_API_KEY: ""
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          # Baseline and neutrality gates require complete tag/history provenance.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'

      - name: Hermetic provider-key preflight
        run: uv run python3 tools/linters/check_test_hygiene.py

      - name: Install locked dependencies
        run: |
          uv sync --frozen
          npm ci

      - name: Install rootless sandbox runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-all --unshare-user --ro-bind / / -- /usr/bin/true

      - name: Repo paths test (F-20)
        run: python3 -m unittest test.test_repo_paths

      - name: Generated types check (F-13)
        run: python3 tools/codegen/generate_types.py --check

      - name: Duplication detector (F-16)
        run: python3 tools/linters/check_duplication.py --enforce

      - name: Path hygiene check
        run: python3 tools/linters/check_path_hygiene.py

      - name: Kernel package tests
        run: python3 -m unittest discover -s test/kernel -t .

      - name: Agency package tests
        run: python3 -m unittest discover -s test/agency -t .

      - name: Contracts package tests
        run: python3 -m unittest discover -s test/contracts -t .

      - name: Runtime package tests (Ollama quarantined via skipUnless)
        run: python3 -m unittest discover -s test/runtime -t .

      - name: Replay parity (F-02, cold fold from disk)
        run: python3 -m unittest test.runtime.test_ledger_truth.ColdReplayParity

      # Plugin isolation / registry (2.1-D conformance). Not optional: this is
      # the suite that caught the non-canonical pack dialect after ceiling
      # delegation. Deletion (2.2-B) stays blocked until this stays green.
      - name: Registry and plugin-cell isolation
        run: python3 -m unittest discover -s test/registry -t .

      - name: Adapters package tests
        run: python3 -m unittest discover -s test/adapters -t .

      - name: Security package tests
        run: python3 -m unittest discover -s test/security -t .

      - name: Trust package tests
        run: python3 -m unittest discover -s test/trust -t .

      # M-1 closed with F-01..F-21 all green on the canonical path, so the
      # falsifier register stops being an advisory red and becomes a gate.
      # Wave 0's "reds allowed" allowance expired with the milestone.
      - name: Bound falsifiers F-01..F-21 (gating from M-1)
        run: python3 -m unittest discover -s test/falsifiers -t .

      - name: Hexagonal boundary lattice check
        run: python3 tools/linters/check_boundaries.py

      - name: TCB budget safety check
        run: python3 tools/linters/check_tcb_budget.py

      - name: Domain-blindness (I-7, F-18)
        run: python3 tools/linters/check_domain_blindness.py

      - name: Isolation policy (I-6)
        run: python3 tools/linters/check_isolation_policy.py

      - name: Event coverage (E-COV, SPEC §1.2, ADR-0076 §6)
        run: python3 tools/linters/check_event_coverage.py

      - name: Code-default pack tests
        run: python3 -m unittest discover -s test/packs -t .

      - name: TypeScript typecheck and tests
        run: |
          npm run typecheck
          npm test

      - name: Stale documentation paths check
        run: python3 tools/linters/check_stale_paths.py

      - name: Documentation metadata and context budgets
        run: |
          python3 tools/linters/check_doc_metadata.py
          python3 tools/linters/check_doc_budgets.py

      - name: Canonical execution truth check
        run: python3 tools/linters/check_execution_truth.py

      - name: Falsifier identifier allocation check (RF-72)
        run: python3 tools/linters/check_falsifier_ids.py

      - name: Local markdown links check
        run: python3 tools/linters/check_markdown_links.py

      - name: Markdown linting and MkDocs strict build
        run: |
          npx markdownlint-cli2 "docs/**/*.md" "README.md" "AGENTS.md" "VISION.md"
          uv run mkdocs build --strict

      - name: Secret scan check
        run: python3 tools/linters/scan_secrets.py

      - name: RF-86 successor substrate gate (when applicable)
        run: |
          if git rev-parse --verify --quiet 'refs/tags/CONVERGENCE-BASE-v1^{commit}' >/dev/null; then
            bash ci/rf86_gate.sh CONVERGENCE-BASE-v1
          else
            echo 'RF-86 NOT APPLICABLE: ADR-0102 successor baseline has not been accepted; no pass is claimed.'
          fi

  vanguard-windows-portable:
    name: Portable Core & Hygiene Gates (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'

      - name: Install locked dependencies
        run: |
          uv sync --frozen
          npm ci

      - name: Path hygiene check
        run: uv run python tools/linters/check_path_hygiene.py

      - name: Repo paths test (F-20)
        run: uv run python -m unittest test.test_repo_paths

      - name: Hexagonal boundary lattice check
        run: uv run python tools/linters/check_boundaries.py

      - name: TCB budget safety check
        run: uv run python tools/linters/check_tcb_budget.py

      - name: Domain-blindness (I-7, F-18)
        run: uv run python tools/linters/check_domain_blindness.py

      - name: Isolation policy (I-6)
        run: uv run python tools/linters/check_isolation_policy.py

      - name: Kernel package tests
        run: uv run python -m unittest discover -s test/kernel -t .

      - name: Agency package tests
        run: uv run python -m unittest discover -s test/agency -t .

      - name: Contracts package tests
        run: uv run python -m unittest discover -s test/contracts -t .

      - name: TypeScript typecheck and tests
        run: |
          npm run typecheck
          npm test

      - name: Documentation metadata and link validation
        run: |
          uv run python tools/linters/check_doc_metadata.py
          uv run python tools/linters/check_markdown_links.py
          npx markdownlint-cli2 "docs/**/*.md" "README.md" "AGENTS.md" "VISION.md"
          uv run mkdocs build --strict
