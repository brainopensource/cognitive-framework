<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background:#0d1117; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="gBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#0d419d"/>
    </linearGradient>
    <linearGradient id="gPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8957e5"/>
      <stop offset="100%" stop-color="#5522b0"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#115520"/>
    </linearGradient>
    <linearGradient id="gRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#da3633"/>
      <stop offset="100%" stop-color="#8e1519"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#bc8cff" />
    </marker>
  </defs>

  <!-- Title Header -->
  <text x="600" y="45" fill="#f0f6fc" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="0.5">AETHER / VANGUARD: THREE PLANES &amp; 13-STAGE KERNEL DISPATCH</text>
  <text x="600" y="70" fill="#8b949e" font-size="14" text-anchor="middle">Separation of Concerns: Volatile Decision, Immutable State &amp; Cryptographic Evidence</text>

  <!-- ================= PLANE 1: DECISION PLANE ================= -->
  <g transform="translate(40, 95)" filter="url(#shadow)">
    <rect width="340" height="665" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect width="340" height="42" rx="12" fill="#1f6feb" fill-opacity="0.15"/>
    <text x="170" y="27" fill="#58a6ff" font-size="15" font-weight="700" text-anchor="middle">1. DECISION PLANE (Volatile)</text>
    
    <!-- Model & Prompt -->
    <rect x="20" y="60" width="300" height="90" rx="8" fill="#21262d" stroke="#388bfd" stroke-width="1"/>
    <text x="35" y="85" fill="#58a6ff" font-size="14" font-weight="600">Foundation Models (LLM)</text>
    <text x="35" y="105" fill="#8b949e" font-size="12">• Frontier Models (Deep Reasoning)</text>
    <text x="35" y="125" fill="#8b949e" font-size="12">• Local Models (Sub-100ms Reflex)</text>
    <text x="35" y="140" fill="#8b949e" font-size="11" font-style="italic">Uncertain / Probabilistic Cognitive Potential</text>

    <!-- Planner & Strategy -->
    <rect x="20" y="170" width="300" height="110" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="35" y="195" fill="#f0f6fc" font-size="14" font-weight="600">Iterative Decision Policy</text>
    <text x="35" y="218" fill="#8b949e" font-size="12">• ReAct / TreeSearch / Reflective Loop</text>
    <text x="35" y="238" fill="#8b949e" font-size="12">• Abductive Hypothesis Generation</text>
    <text x="35" y="258" fill="#8b949e" font-size="12">• Proposes: EffectRequest { verb, args }</text>

    <!-- Identity D_H -->
    <rect x="20" y="300" width="300" height="90" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="35" y="325" fill="#e3b341" font-size="14" font-weight="600">Composition Identity (D_H)</text>
    <text x="35" y="348" fill="#8b949e" font-size="12">RFC 8785 (JCS) Digest over:</text>
    <text x="35" y="368" fill="#8b949e" font-size="12">• Manifest + Prompts + Tools + Leases</text>

    <!-- Context Compactor -->
    <rect x="20" y="410" width="300" height="110" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="35" y="435" fill="#f0f6fc" font-size="14" font-weight="600">Context Engineering Engine</text>
    <text x="35" y="458" fill="#8b949e" font-size="12">• AST Anchor &amp; Repo Map</text>
    <text x="35" y="478" fill="#8b949e" font-size="12">• Hierarchical L1-L5 Compaction</text>
    <text x="35" y="498" fill="#8b949e" font-size="12">• Zero O(N²) Conversational Noise</text>

    <path d="M 20 540 L 320 540" stroke="#30363d" stroke-dasharray="4 4"/>
    <text x="170" y="575" fill="#f85149" font-size="12" font-weight="600" text-anchor="middle">Failure Mode Isolation</text>
    <text x="170" y="598" fill="#8b949e" font-size="11" text-anchor="middle">Hallucinations, crashes, and retries</text>
    <text x="170" y="618" fill="#8b949e" font-size="11" text-anchor="middle">never corrupt physical state or truth.</text>
  </g>

  <!-- ================= CORE KERNEL (S0-S12 PIPELINE) ================= -->
  <g transform="translate(420, 95)" filter="url(#shadow)">
    <rect width="360" height="665" rx="12" fill="#161b22" stroke="#8957e5" stroke-width="1.5"/>
    <rect width="360" height="42" rx="12" fill="#8957e5" fill-opacity="0.15"/>
    <text x="180" y="27" fill="#d2a8ff" font-size="15" font-weight="700" text-anchor="middle">TCB CAPABILITY KERNEL (S0–S12)</text>

    <!-- 13 Stages Flow -->
    <g transform="translate(20, 55)">
      <!-- S0-S3 -->
      <rect x="0" y="0" width="320" height="75" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="15" y="22" fill="#bc8cff" font-size="12" font-weight="700">S0–S3: INGESTION &amp; IDENTITY</text>
      <text x="15" y="42" fill="#f0f6fc" font-size="11">S0 Observe · S1 Intercept · S2 Verify · S3 Attenuate</text>
      <text x="15" y="60" fill="#8b949e" font-size="10">Validate Grant signatures &amp; Monotonic Leases</text>

      <!-- S4-S6 -->
      <rect x="0" y="85" width="320" height="75" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="15" y="107" fill="#bc8cff" font-size="12" font-weight="700">S4–S6: POLICY &amp; BUDGET CONTROL</text>
      <text x="15" y="127" fill="#f0f6fc" font-size="11">S4 Classify · S5 RateLimit · S6 ReserveBudget</text>
      <text x="15" y="145" fill="#8b949e" font-size="10">Debit Additive Budget (USD, Tokens, Time, Bytes)</text>

      <!-- S7-S9 -->
      <rect x="0" y="170" width="320" height="75" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="15" y="192" fill="#bc8cff" font-size="12" font-weight="700">S7–S9: GOVERNANCE &amp; ISOLATION</text>
      <text x="15" y="212" fill="#f0f6fc" font-size="11">S7 CheckApproval · S8 Delegate · S9 SandboxMount</text>
      <text x="15" y="230" fill="#8b949e" font-size="10">Mount rootless user-namespace &amp; bwrap sandbox</text>

      <!-- S10-S12 -->
      <rect x="0" y="255" width="320" height="75" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="15" y="277" fill="#bc8cff" font-size="12" font-weight="700">S10–S12: EXECUTE, AUDIT &amp; COMMIT</text>
      <text x="15" y="297" fill="#f0f6fc" font-size="11">S10 DispatchProc · S11 AuditProvenance · S12 Commit</text>
      <text x="15" y="315" fill="#8b949e" font-size="10">Single-writer emit to WAL; commit budget debits</text>
    </g>

    <!-- Typed resource algebra callout -->
    <rect x="20" y="405" width="320" height="90" rx="8" fill="#0d1117" stroke="#388bfd" stroke-width="1"/>
    <text x="35" y="428" fill="#58a6ff" font-size="13" font-weight="600">Typed Resource Algebra (R)</text>
    <text x="35" y="450" fill="#8b949e" font-size="11">Additive: USD (μ$), Tokens, Bytes, Time (ms)</text>
    <text x="35" y="468" fill="#8b949e" font-size="11">Ceilings: Max Turns (k), Recursion Depth (d)</text>
    <text x="35" y="486" fill="#3fb950" font-size="10" font-weight="600">Strictly Non-Negotiable Fail-Closed Enforcement</text>

    <!-- Sandbox Boundary Box -->
    <rect x="20" y="510" width="320" height="135" rx="8" fill="#21262d" stroke="#238636" stroke-width="1"/>
    <text x="35" y="535" fill="#3fb950" font-size="13" font-weight="700">Rootless Sandbox Cell (UID 10001)</text>
    <text x="35" y="555" fill="#8b949e" font-size="11">• bubblewrap POSIX user namespaces</text>
    <text x="35" y="573" fill="#8b949e" font-size="11">• Read-only system mounts, ephemeral /tmp</text>
    <text x="35" y="591" fill="#8b949e" font-size="11">• POSIX setrlimit (CPU, memory, file descriptors)</text>
    <text x="35" y="609" fill="#8b949e" font-size="11">• Subprocess fault isolation: zero runtime crash</text>
    <text x="35" y="630" fill="#58a6ff" font-size="10" font-weight="600">Pure/Observation/Privileged Sink Mediation</text>
  </g>

  <!-- ================= PLANE 2 & 3: STATE & EVIDENCE ================= -->
  <g transform="translate(820, 95)" filter="url(#shadow)">
    <!-- STATE PLANE -->
    <rect width="340" height="320" rx="12" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
    <rect width="340" height="42" rx="12" fill="#238636" fill-opacity="0.15"/>
    <text x="170" y="27" fill="#3fb950" font-size="15" font-weight="700" text-anchor="middle">2. STATE PLANE (Immutable Truth)</text>

    <g transform="translate(20, 55)">
      <rect width="300" height="65" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="15" y="25" fill="#3fb950" font-size="13" font-weight="600">WAL Event Sourcing Ledger</text>
      <text x="15" y="45" fill="#8b949e" font-size="11">• Append-only SQLite WAL (Single Writer)</text>
      <text x="15" y="58" fill="#8b949e" font-size="10">• 56 Canonically Verified Event Kinds</text>

      <rect y="75" width="300" height="65" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="15" y="98" fill="#3fb950" font-size="13" font-weight="600">Pure State Reduction (Reducer)</text>
      <text x="15" y="118" fill="#8b949e" font-size="11">• Zero I/O · Zero Clocks · Zero Randomness</text>
      <text x="15" y="132" fill="#8b949e" font-size="10">• Cold Replay Parity: State = Fold(Events)</text>

      <rect y="150" width="300" height="65" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="15" y="173" fill="#e3b341" font-size="13" font-weight="600">Runtime Identity (D_R)</text>
      <text x="15" y="193" fill="#8b949e" font-size="11">• Merkle DAG digest of event history</text>
      <text x="15" y="206" fill="#8b949e" font-size="10">• Unforgeable Trajectory (mhf.trajectory/1)</text>
    </g>

    <!-- EVIDENCE PLANE -->
    <g transform="translate(0, 345)">
      <rect width="340" height="320" rx="12" fill="#161b22" stroke="#da3633" stroke-width="1.5"/>
      <rect width="340" height="42" rx="12" fill="#da3633" fill-opacity="0.15"/>
      <text x="170" y="27" fill="#f85149" font-size="15" font-weight="700" text-anchor="middle">3. EVIDENCE PLANE (Exterior Judge)</text>

      <g transform="translate(20, 55)">
        <rect width="300" height="65" rx="6" fill="#21262d" stroke="#da3633" stroke-width="1"/>
        <text x="15" y="25" fill="#f85149" font-size="13" font-weight="600">Exterior Evaluator (UID 10002)</text>
        <text x="15" y="45" fill="#8b949e" font-size="11">• Physically Isolated Exterior Daemon</text>
        <text x="15" y="58" fill="#8b949e" font-size="10">• Completely unreachable from Agent process</text>

        <rect y="75" width="300" height="65" rx="6" fill="#21262d" stroke="#30363d"/>
        <text x="15" y="98" fill="#f85149" font-size="13" font-weight="600">Ed25519 Cryptographic Verdicts</text>
        <text x="15" y="118" fill="#8b949e" font-size="11">• Signs binary pass/fail verdicts</text>
        <text x="15" y="132" fill="#8b949e" font-size="10">• Bound to Task Nonce, D_H, D_R, and Oracle Hash</text>

        <rect y="150" width="300" height="95" rx="6" fill="#21262d" stroke="#30363d"/>
        <text x="15" y="173" fill="#58a6ff" font-size="13" font-weight="600">Socratic Falsification Invariant</text>
        <text x="15" y="193" fill="#8b949e" font-size="11">• Agent self-attestations are discarded</text>
        <text x="15" y="211" fill="#8b949e" font-size="11">• Unsigned verdicts = Unconditional fail-closed</text>
        <text x="15" y="233" fill="#3fb950" font-size="10" font-weight="600">Non-Collusive Ground Truth Architecture</text>
      </g>
    </g>
  </g>

  <!-- Connection Arrows -->
  <path d="M 380 200 L 420 200" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="190" fill="#58a6ff" font-size="10" text-anchor="middle">EffectRequest</text>

  <path d="M 780 395 L 820 395" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="800" y="385" fill="#3fb950" font-size="10" text-anchor="middle">Event Commit</text>

  <path d="M 780 570 L 820 570" stroke="#f85149" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="560" fill="#f85149" font-size="10" text-anchor="middle">Evaluate</text>

  <path d="M 820 620 L 780 620" stroke="#bc8cff" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="800" y="640" fill="#bc8cff" font-size="10" text-anchor="middle">Signed Verdict</text>
</svg>
