      <text x="20" y="165" fill="#8b949e" font-size="11">❌ SBFL Spectrum Fault Localization</text>

      <rect x="20" y="190" width="380" height="150" rx="8" fill="#161b22" stroke="#8957e5"/>
      <text x="35" y="215" fill="#a371f7" font-size="13" font-weight="bold">Empirical Performance Metrics:</text>
      <text x="35" y="240" fill="#f0f6fc" font-size="11">• Mean Turns to Resolve: <tspan fill="#a371f7">4.0 – 5.0 turns</tspan></text>
      <text x="35" y="260" fill="#f0f6fc" font-size="11">• SWE-Bench Verified: <tspan fill="#a371f7">62.4% ± 3.0%</tspan></text>
      <text x="35" y="280" fill="#f0f6fc" font-size="11">• SWE-Bench Pro (Hard): <tspan fill="#a371f7">35.8% ± 3.5%</tspan></text>
      <text x="35" y="300" fill="#f0f6fc" font-size="11">• AST Pre-Flight Intercepts: <tspan fill="#3fb950">100% Syntax Saved</tspan></text>
      <text x="35" y="320" fill="#f0f6fc" font-size="11">• Mean Latency: <tspan fill="#58a6ff">15.35 seconds</tspan></text>
    </g>
