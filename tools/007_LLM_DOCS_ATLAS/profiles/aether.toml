# AETHER / Vanguard repository profile.
# Applied ONLY when explicitly selected — via lda.yaml 'profile: aether' or
# $LDA_PROFILE=aether — never by artifact side-channel detection.
name = "aether"
generated_root = ".generated"
cache_root = ".generated/lda-cache"

# AETHER authority vocabulary (catalog.jsonl 'authority' values).
preferred_authority = ["constitutional", "normative", "canonical"]
secondary_authority = ["descriptive", "reference"]
excluded_authority = ["non-canonical", "generated"]

knowledge_adapter = "aether-knowledge"
validation_commands = [["just", "docs-check"], ["just", "verify"]]

# AETHER documentation taxonomy: non-canonical authority tiers by directory
# (AGENTS.md documentation hierarchy).
non_canonical_prefixes = ["docs/research/", "docs/reports/", "docs/theory/"]

# Aether-specific low-signal locators (benchmark runs, workspace dirs, mocks)
# merged over the generic defaults by replacing the default list.
low_signal_patterns = [
  "test/broken/", "/runs/", "benchmarks/frontier", "__init__.py", "/dist",
  "site/", "answer_bank", ".vanguard/", "node_modules", "dashboard.html",
  "tools/lda/index.html",
]

# Code/document extension sets for the AETHER monorepo (TS frontend + Python backend).
code_extensions = [".py", ".ts", ".tsx", ".mts", ".cts", ".js", ".jsx", ".mjs", ".rs", ".go", ".java", ".kt", ".cs", ".c", ".h", ".cpp", ".hpp", ".sh", ".rb", ".php", ".sql"]
document_extensions = [".md", ".mdx", ".rst", ".txt"]

# Workspace-local directories excluded from discovery (merged with generic
# defaults by the providers).
excluded_dirs = [
  ".git", ".venv", "node_modules", "dist", "dist-browser", "build", "site",
  ".site", "out", "__pycache__", ".tox", ".coverage", "coverage",
  ".pytest_cache", ".ruff_cache", "dev_context_logs",
  # Shadow copies of the codebase committed under docs/reports/reviews/.
  # These contain a full duplicate vanguard/ tree and dormant wave sources.
  # Indexing them outranks production symbols and routes agents to edit dead
  # code. Both names exist only under docs/reports/reviews/electroweak_v092/;
  # the review .md files at that parent level stay indexed.
  "front", "back", "aether-v092b-frontend",
  # Gitignored agent scratch workspaces. Throwaway benchmark run trees that
  # contributed 61% of all indexed symbols and dominated PageRank in repomap.
  ".vanguard", "runs",
]

# Bounded-growth invariant: cap globally ranked symbols at Top-K.
max_global_symbols = 500

# Context packets bind to the live workspace git HEAD (fail-closed freshness).
require_head_match = true

[labels]
constitutional = "Constitutional"
normative = "Normative"
canonical = "Canonical"