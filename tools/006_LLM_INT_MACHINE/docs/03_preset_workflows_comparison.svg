      <text x="345" y="23" fill="#fff" font-size="10" font-weight="bold">ROBUST</text>

      <text x="20" y="65" fill="#f0f6fc" font-size="12" font-weight="bold">Feature Matrix:</text>
      <text x="20" y="85" fill="#3fb950" font-size="11">✅ In-Process AST Syntax Preflight (0.2ms)</text>
      <text x="20" y="105" fill="#3fb950" font-size="11">✅ Gated Dual-Loop Reproducer Protocol</text>
