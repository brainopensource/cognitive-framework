<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 880" width="100%" height="100%" style="background:#0d1117; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="gradHeader4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8957e5" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#388bfd" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0e131a"/>
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowB4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowG4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="20" width="1340" height="70" rx="12" fill="url(#gradHeader4)" stroke="#30363d" stroke-width="1"/>
  <text x="60" y="52" fill="#58a6ff" font-size="22" font-weight="bold">INPUT &amp; OUTPUT ALGORITHMS PIPELINE</text>
  <text x="60" y="74" fill="#8b949e" font-size="13">Detailed Engineering Transformation Flow: Algorithms Applied to LLM Inputs vs. Algorithms Applied to Outputs</text>

  <!-- Left: Algorithms Applied to Inputs -->
  <g transform="translate(40, 110)">
    <rect width="630" height="730" rx="14" fill="url(#cardGrad4)" stroke="#1f6feb" stroke-width="1.5" filter="url(#shadow4)"/>
    <rect width="630" height="42" rx="14" fill="#1f6feb" fill-opacity="0.15"/>
    <text x="20" y="27" fill="#58a6ff" font-size="15" font-weight="bold">📥 ALGORITHMS &amp; TRANSFORMS APPLIED TO INPUTS</text>

    <!-- Alg 1: Tree Sitter PageRank -->
    <g transform="translate(20, 60)">
      <rect width="590" height="115" rx="8" fill="#161b22" stroke="#8957e5" stroke-width="1"/>
      <circle cx="30" cy="28" r="12" fill="#8957e5"/>
      <text x="26" y="33" fill="#fff" font-size="11" font-weight="bold">1</text>
      <text x="50" y="33" fill="#f0f6fc" font-size="13" font-weight="bold">Tree-Sitter S-Expression AST Graph &amp; Weighted PageRank</text>
      <text x="50" y="55" fill="#8b949e" font-size="11">• Parses full repo AST; builds directed graph G = (V, E) of symbols &amp; calls</text>
      <text x="50" y="73" fill="#a371f7" font-size="11" font-family="monospace">PR(u) = (1-d)/|V| + d * Sum(PR(v) / OutDeg(v))</text>
      <text x="50" y="93" fill="#3fb950" font-size="10" font-weight="bold">Provides O(1) symbol definition &amp; caller lookups in 8ms</text>
    </g>

    <!-- Alg 2: SBFL Ochiai Localizer -->
    <g transform="translate(20, 190)">
      <rect width="590" height="120" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1"/>
      <circle cx="30" cy="28" r="12" fill="#d29922"/>
      <text x="26" y="33" fill="#fff" font-size="11" font-weight="bold">2</text>
      <text x="50" y="33" fill="#f0f6fc" font-size="13" font-weight="bold">Spectrum-Based Fault Localization (SBFL Ochiai)</text>
      <text x="50" y="55" fill="#8b949e" font-size="11">• Traces executed lines across passing vs. failing test executions</text>
      <text x="50" y="73" fill="#e3b341" font-size="11" font-family="monospace">Suspiciousness = e_f / sqrt(n_f * (e_f + e_p))</text>
      <text x="50" y="95" fill="#3fb950" font-size="10" font-weight="bold">Directly injects top-5 suspicious lines on Turn 1 prompt</text>
    </g>

    <!-- Alg 3: Dynamic Tool Schema Pruning -->
    <g transform="translate(20, 325)">
      <rect width="590" height="115" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="1"/>
      <circle cx="30" cy="28" r="12" fill="#1f6feb"/>
      <text x="26" y="33" fill="#fff" font-size="11" font-weight="bold">3</text>
      <text x="50" y="33" fill="#f0f6fc" font-size="13" font-weight="bold">Dynamic Tool Schema Pruning &amp; Phase Filtering</text>
      <text x="50" y="55" fill="#8b949e" font-size="11">• Phase LOCALIZATION: Exposes fs_read, code_find_definitions, fs_search</text>
      <text x="50" y="73" fill="#8b949e" font-size="11">• Phase EXECUTION: Exposes only patch_apply and proc_exec</text>
      <text x="50" y="93" fill="#3fb950" font-size="10" font-weight="bold">Saves 35% prompt tokens per turn; prevents invalid tool calls</text>
    </g>

    <!-- Alg 4: L1-L5 Radix Prefix Compiler -->
    <g transform="translate(20, 455)">
      <rect width="590" height="120" rx="8" fill="#161b22" stroke="#238636" stroke-width="1"/>
      <circle cx="30" cy="28" r="12" fill="#238636"/>
      <text x="26" y="33" fill="#fff" font-size="11" font-weight="bold">4</text>
      <text x="50" y="33" fill="#f0f6fc" font-size="13" font-weight="bold">L1–L5 Radix Prompt Prefix Compiler &amp; Cache Alignment</text>
      <text x="50" y="55" fill="#8b949e" font-size="11">• Partitions prompt into: L1(System), L2(Tools), L3(Env), L4(Task), L5(Dialogue)</text>
      <text x="50" y="73" fill="#8b949e" font-size="11">• Guarantees deterministic byte-for-byte prefix stability for GPU KV-cache</text>
      <text x="50" y="95" fill="#3fb950" font-size="10" font-weight="bold">Enforces 72.5% prompt cache hit rate across all model backends</text>
    </g>

    <!-- Alg 5: Subagent Summary Compaction -->
    <g transform="translate(20, 590)">
      <rect width="590" height="115" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="1"/>
      <circle cx="30" cy="28" r="12" fill="#f0883e"/>
      <text x="26" y="33" fill="#fff" font-size="11" font-weight="bold">5</text>
      <text x="50" y="33" fill="#f0f6fc" font-size="13" font-weight="bold">Subagent Isolation &amp; Structured Context Compaction</text>
      <text x="50" y="55" fill="#8b949e" font-size="11">• Ephemeral subagents explore large repos in clean isolated contexts</text>
      <text x="50" y="73" fill="#8b949e" font-size="11">• Extract 3-line structured summaries: Decisions, Invariants, Avoided Dead-Ends</text>
      <text x="50" y="93" fill="#3fb950" font-size="10" font-weight="bold">Maintains parent context under 10k tokens across 15+ turns</text>
    </g>
  </g>

  <!-- Right: Algorithms Applied to Outputs -->
  <g transform="translate(730, 110)">
    <rect width="630" height="730" rx="14" fill="url(#cardGrad4)" stroke="#3fb950" stroke-width="1.5" filter="url(#shadow4)"/>
    <rect width="630" height="42" rx="14" fill="#3fb950" fill-opacity="0.15"/>
    <text x="20" y="27" fill="#3fb950" font-size="15" font-weight="bold">📤 ALGORITHMS &amp; VERIFIERS APPLIED TO OUTPUTS</text>

    <!-- Alg 1: In-Process AST Preflight -->
    <g transform="translate(20, 60)">
      <rect width="590" height="115" rx="8" fill="#161b22" stroke="#da3633" stroke-width="1"/>
      <circle cx="30" cy="28" r="12" fill="#da3633"/>
      <text x="26" y="33" fill="#fff" font-size="11" font-weight="bold">1</text>
      <text x="50" y="33" fill="#f0f6fc" font-size="13" font-weight="bold">In-Process AST Syntax Pre-Flight Compiler Gate</text>
      <text x="50" y="55" fill="#8b949e" font-size="11">• Intercepts model patch before disk write: ast.parse(patched_content)</text>
      <text x="50" y="73" fill="#f85149" font-size="11" font-family="monospace">Executes in 0.2ms; catches IndentationError &amp; SyntaxError</text>
      <text x="50" y="93" fill="#3fb950" font-size="10" font-weight="bold">Saves 15–30 seconds of wasted test runner timeout per syntax slip</text>
    </g>

    <!-- Alg 2: Gated Reproducer Protocol -->
    <g transform="translate(20, 190)">
      <rect width="590" height="120" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1"/>
      <circle cx="30" cy="28" r="12" fill="#d29922"/>
      <text x="26" y="33" fill="#fff" font-size="11" font-weight="bold">2</text>
      <text x="50" y="33" fill="#f0f6fc" font-size="13" font-weight="bold">Gated Dual-Loop Reproducer State-Machine</text>
      <text x="50" y="55" fill="#8b949e" font-size="11">• Transitions: LOCALIZE -&gt; REPRO_FAILS -&gt; PATCH_AND_PASS -&gt; REGRESS</text>
      <text x="50" y="73" fill="#8b949e" font-size="11">• Strict precondition: Patch is rejected if reproducer test never failed</text>
      <text x="50" y="95" fill="#3fb950" font-size="10" font-weight="bold">Guarantees formal proof of defect before accepting model fix</text>
    </g>

    <!-- Alg 3: Head/Tail Log Pager -->
    <g transform="translate(20, 325)">
      <rect width="590" height="115" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="1"/>
      <circle cx="30" cy="28" r="12" fill="#1f6feb"/>
      <text x="26" y="33" fill="#fff" font-size="11" font-weight="bold">3</text>
      <text x="50" y="33" fill="#f0f6fc" font-size="13" font-weight="bold">Head/Tail Log Slicing &amp; Noise Reduction</text>
      <text x="50" y="55" fill="#8b949e" font-size="11">• Captures verbose pytest / compiler outputs exceeding 1000 lines</text>
      <text x="50" y="73" fill="#8b949e" font-size="11">• Retains Top-250 (command header) + Bottom-750 (traceback &amp; assertion)</text>
      <text x="50" y="93" fill="#3fb950" font-size="10" font-weight="bold">Preserves critical failure context while shedding 90% log noise</text>
    </g>

    <!-- Alg 4: Mutation Falsifier -->
    <g transform="translate(20, 455)">
      <rect width="590" height="120" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1"/>
      <circle cx="30" cy="28" r="12" fill="#a371f7"/>
      <text x="26" y="33" fill="#fff" font-size="11" font-weight="bold">4</text>
      <text x="50" y="33" fill="#f0f6fc" font-size="13" font-weight="bold">Type-Aware Mutation Testing Engine (EvalPlus / LLMorpheus)</text>
      <text x="50" y="55" fill="#8b949e" font-size="11">• Generates 5 syntactic mutants across modified diff lines (==, &lt;, and/or)</text>
      <text x="50" y="73" fill="#a371f7" font-size="11" font-family="monospace">Mutation Score = (Mutants Failing Test) / Total</text>
      <text x="50" y="95" fill="#3fb950" font-size="10" font-weight="bold">Rejects tautological / overfitted fixes; enforces Score &gt;= 0.80</text>
    </g>

    <!-- Alg 5: SHA-256 Receipt -->
    <g transform="translate(20, 590)">
      <rect width="590" height="115" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="1"/>
      <circle cx="30" cy="28" r="12" fill="#2ea043"/>
      <text x="26" y="33" fill="#fff" font-size="11" font-weight="bold">5</text>
      <text x="50" y="33" fill="#f0f6fc" font-size="13" font-weight="bold">Sealed Ground-Truth Oracle &amp; Signed Run Receipt</text>
      <text x="50" y="55" fill="#8b949e" font-size="11">• Executes non-leaked oracle verification test suite in isolation</text>
      <text x="50" y="73" fill="#8b949e" font-size="11">• Generates SHA-256 cryptographic receipt with turns, tokens, cost, latency</text>
      <text x="50" y="93" fill="#3fb950" font-size="10" font-weight="bold">Appends to permanent historical catalog and exports HTML dashboard</text>
    </g>
  </g>

  <!-- Central Flow Connector -->
  <path d="M 670 475 L 730 475" stroke="#58a6ff" stroke-width="3" stroke-dasharray="4 2" marker-end="url(#arrowB4)"/>
</svg>
