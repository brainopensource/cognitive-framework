        <text x="0" y="40" fill="#3fb950" font-size="11">✅ SBFL Ochiai Dynamic Fault Localization (Injects Top-5 defect lines on Turn 1)</text>
        <text x="0" y="60" fill="#3fb950" font-size="11">✅ Tree-Sitter S-Expression Symbol Graph &amp; Weighted PageRank (8ms index)</text>
        <text x="0" y="80" fill="#3fb950" font-size="11">✅ Dynamic Tool Pruning (Prunes inactive tools; saves 35% tokens per turn)</text>
        <text x="0" y="100" fill="#3fb950" font-size="11">✅ In-Process AST Syntax Pre-Flight (0.2ms failure turnaround)</text>
        <text x="0" y="120" fill="#3fb950" font-size="11">✅ Compatible with Free Models &amp; Local Windows Host Ollama ($0.00)</text>

        <rect x="0" y="140" width="600" height="170" rx="8" fill="#161b22" stroke="#d29922"/>
        <text x="20" y="170" fill="#e3b341" font-size="14" font-weight="bold">Live Testbed Benchmark Results (Tiers 1, 3, 6, 8):</text>
        <text x="20" y="195" fill="#f0f6fc" font-size="11">• Tier 1 LRU Cache: <tspan fill="#3fb950" font-weight="bold">3 Turns | 5,645 Tokens | $0.00067 USD | 8.14s</tspan></text>
        <text x="20" y="215" fill="#f0f6fc" font-size="11">• Tier 3 Token Bucket: <tspan fill="#3fb950" font-weight="bold">3 Turns | 4,421 Tokens | $0.00048 USD | 7.89s (🏆 Fastest)</tspan></text>
        <text x="20" y="235" fill="#f0f6fc" font-size="11">• Tier 6 Raft Consensus: <tspan fill="#3fb950" font-weight="bold">3 Turns | 4,465 Tokens | $0.00049 USD | 12.20s</tspan></text>
        <text x="20" y="255" fill="#f0f6fc" font-size="11">• Tier 8 AST Compiler: <tspan fill="#3fb950" font-weight="bold">5 Turns | 7,754 Tokens | $0.00086 USD | 14.49s</tspan></text>
        <text x="20" y="275" fill="#f0f6fc" font-size="11">• Local Ollama (qwen3.8:27b): <tspan fill="#3fb950" font-weight="bold">3 Turns | $0.00000 USD | 100% Pass Rate</tspan></text>
        <text x="20" y="295" fill="#58a6ff" font-size="11" font-weight="bold">Composite Pareto Score: 1,072,344.5 (Highest in Entire Benchmark Matrix)</text>
      </g>
    </g>

