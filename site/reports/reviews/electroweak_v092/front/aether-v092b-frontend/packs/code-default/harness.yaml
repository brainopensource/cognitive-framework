api: mhf.harness/1
id: code-default
plugins:
  planner:
    ref: mhf.planner.drive-until-green@^1
    config:
      max_repair_rounds: 4
      compaction: recency-window
  context:
    ref: mhf.context.repo-map@^1
    config:
      token_budget: 4000
      compaction: recency-window
      prefix_freeze: true
  memory:
    ref: mhf.memory.sqlite-kv@^1
  evaluation:
    ref: mhf.eval.oracle-gate@^1
    config:
      oracle: coding-oracle@3
  completion:
    ref: mhf.completion.code-default@^1
  toolkits:
    - ref: mhf.toolkit.fs@^1
    - ref: mhf.toolkit.ast-patch@^2
    - ref: mhf.toolkit.terminal@^1
    - ref: mhf.toolkit.index@^1
  model_routes:
    - tier: 1
      provider: ollama
      model: qwen2.5:1.5b
    - tier: 2
      provider: openrouter
      model: deepseek/deepseek-v4-flash
      escalate_on:
        - verdict_fail
        - budget_ok
    - tier: 3
      provider: openrouter
      model: "$FRONTIER"
      escalate_on:
        - verdict_fail
        - budget_ok
system_prompt: ./system-prompt.txt
capabilities:
  - verb: fs.read
    selector:
      kind: fs
      root: /workspace
      paths:
        - /workspace
  - verb: fs.search
    selector:
      kind: fs
      root: /workspace
      paths:
        - /workspace
  - verb: patch.apply
    selector:
      kind: fs
      root: /workspace
      paths:
        - /workspace
  - verb: proc.exec
    selector:
      kind: generic
      uriPattern: proc://exec/allow/git,pytest,ruff,python3
budget:
  usd_micros: 250000
  millis: 1800000
  tokens: 64000
  bytes: 0
  turns: 40
  depth: 2
approval_policy: ./approval-policy.json
undeletable: false
