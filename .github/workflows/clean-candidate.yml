name: vanguard-clean-candidate

# Clean-clone verification. Does not publish, tag, or rewrite history.

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  clean-candidate:
    name: Clean checkout gates
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ""
      DEEPSEEK_API_KEY: ""
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record candidate SHA
        run: |
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git rev-parse HEAD
          test -z "$(git status --porcelain)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'

      - name: Forbidden local state
        run: |
          test ! -e .env
          test ! -d node_modules
          python3 tools/linters/check_test_hygiene.py
          python3 tools/linters/scan_secrets.py

      - name: Install locked dependencies
        run: |
          python3 -m pip install -r requirements.lock
          npm ci

      - name: Python unit tests
        run: python3 -m unittest discover -s test -t .

      - name: TypeScript typecheck and tests
        run: |
          npm run typecheck
          npm test

      - name: Governance and living gates
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 tools/linters/check_stale_paths.py
          python3 tools/linters/check_markdown_links.py
          python3 tools/linters/check_doc_metadata.py
          python3 tools/linters/check_doc_budgets.py
          python3 tools/linters/check_execution_truth.py
          python3 tools/codegen/generate_types.py --check
          python3 tools/linters/check_boundaries.py
          python3 tools/linters/check_tcb_budget.py
          python3 tools/linters/check_event_coverage.py
          python3 tools/linters/check_falsifier_ids.py
          python3 tools/linters/check_commit_scope.py
          python3 tools/linters/scan_secrets.py

      - name: Baseline status is explicit
        run: |
          if python3 tools/linters/check_baseline_manifest.py --release; then
            echo 'Successor baseline manifest verified.'
          else
            echo 'Successor baseline remains BLOCKED; clean-candidate does not claim RF-86 or release acceptance.'
          fi
