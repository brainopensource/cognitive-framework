name: vanguard-ci

on:
  push:
    branches: [main, feat/*, feat_*, sprint*]
  pull_request:

permissions:
  contents: read

jobs:
  vanguard-living-gates:
    name: Living Gates — Layer-0, Boundaries, TCB, Links, Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Repo paths test
        run: python3 -m unittest test.test_repo_paths

      - name: Layer-0 microkernel test suite
        run: python3 -m unittest discover -s test/layer0 -t .

      - name: Hexagonal boundary lattice check
        run: python3 tools/check_boundaries.py

      - name: TCB budget safety check
        run: python3 tools/check_tcb_budget.py

      - name: Stale documentation paths check
        run: python3 tools/check_stale_paths.py

      - name: Local markdown links check
        run: python3 tools/check_markdown_links.py

      - name: Secret scan check
        env:
          OPENROUTER_API_KEY: ""
        run: python3 tools/scan_secrets.py
