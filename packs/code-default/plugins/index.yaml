api: mhf.plugin/1
id: mhf.toolkit.index
version: 1.0.0
provides:
  - spi: IToolkit
    spi_version: ">=1.0,<2"
requires: []
isolation: in_process
capabilities:
  - verb: fs.read
    selector:
      kind: fs
      root: /workspace
      paths:
        - /workspace
  - verb: repo.search_symbols
    selector:
      kind: generic
      uriPattern: repo://symbols/*
  - verb: repo.get_callers
    selector:
      kind: generic
      uriPattern: repo://callers/*
  - verb: repo.get_dependencies
    selector:
      kind: generic
      uriPattern: repo://dependencies/*
  - verb: repo.get_tests
    selector:
      kind: generic
      uriPattern: repo://tests/*
entry: toolkits/repo_map.py:IndexToolkit
