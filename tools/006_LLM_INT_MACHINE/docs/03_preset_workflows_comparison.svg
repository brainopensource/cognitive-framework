      <text x="20" y="85" fill="#8b949e" font-size="11">❌ AST Pre-Flight Syntax Filter (Blind edits)</text>
      <text x="20" y="105" fill="#8b949e" font-size="11">❌ SBFL Fault Localization (Random search)</text>
      <text x="20" y="125" fill="#8b949e" font-size="11">❌ Tree-Sitter Symbol PageRank Maps</text>
      <text x="20" y="145" fill="#8b949e" font-size="11">❌ Speculative MCTS / Rollbacks</text>
      <text x="20" y="165" fill="#8b949e" font-size="11">❌ Mutation Testing / Gated Repro</text>

      <rect x="20" y="190" width="380" height="150" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="35" y="215" fill="#f85149" font-size="13" font-weight="bold">Empirical Performance Metrics:</text>
      <text x="35" y="240" fill="#f0f6fc" font-size="11">• Mean Turns to Resolve: <tspan fill="#f85149">6.0 – 10.0 turns</tspan></text>
      <text x="35" y="260" fill="#f0f6fc" font-size="11">• SWE-Bench Verified: <tspan fill="#8b949e">46.2% ± 4.0%</tspan></text>
      <text x="35" y="280" fill="#f0f6fc" font-size="11">• SWE-Bench Pro (Hard): <tspan fill="#8b949e">22.5% ± 4.5%</tspan></text>
      <text x="35" y="300" fill="#f0f6fc" font-size="11">• Mean Cost / Solved Task: <tspan fill="#8b949e">$0.00200 USD</tspan></text>
      <text x="35" y="320" fill="#f0f6fc" font-size="11">• Mean Latency: <tspan fill="#8b949e">23.6 seconds</tspan></text>
