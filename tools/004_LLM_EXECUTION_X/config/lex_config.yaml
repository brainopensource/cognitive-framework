version: "1.0.0"

engine:
  max_healing_retries: 3
  max_re_architect_attempts: 1
  timeout_per_step_sec: 60
  pipelined_workers: true
  circuit_breaker_threshold: 2
  enable_mutation_probe: true
  output_dir: "output"

ollama:
  num_parallel: 2
  max_loaded_models: 2
  vram_poll_interval_ms: 50
  health_check_url: "http://127.0.0.1:11434/api/tags"
  request_timeout_sec: 120

models:
  router:
    enabled: true
    name: "qwen2.5:1.5b"
    endpoint: "http://127.0.0.1:11434"
    options:
      temperature: 0.0
      num_ctx: 2048
      num_predict: 100
      keep_alive: "5m"

  architect:
    name: "qwen3.8:27b"
    endpoint: "http://127.0.0.1:11434"
    options:
      temperature: 0.1
      num_ctx: 4096
      num_predict: 1000
      keep_alive: "0"

  worker_coder:
    name: "qwen2.5-coder:14b"
    endpoint: "http://127.0.0.1:11434"
    options:
      temperature: 0.0
      num_ctx: 4096
      num_predict: 1500
      keep_alive: "15m"

  worker_tester:
    name: "qwen2.5-coder:14b"
    endpoint: "http://127.0.0.1:11434"
    options:
      temperature: 0.0
      num_ctx: 4096
      num_predict: 1500
      keep_alive: "15m"

sandbox:
  isolation_tier: "auto"
  dir_prefix: "/tmp/lex_sandbox_"
  cleanup_on_exit: true
  max_execution_time_sec: 10
  max_memory_mb: 256
  max_file_size_mb: 10
  network_disabled: true
  allowed_imports:
    - "typing"
    - "dataclasses"
    - "collections"
    - "functools"
    - "asyncio"
    - "pydantic"
    - "unittest.mock"
    - "pytest"
    - "math"
    - "time"
    - "json"
    - "hashlib"
