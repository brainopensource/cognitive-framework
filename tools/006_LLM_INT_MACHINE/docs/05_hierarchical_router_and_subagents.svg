<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 880" width="100%" height="100%" style="background:#0d1117; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="gradHeader5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0883e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8957e5" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="cardGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0e131a"/>
    </linearGradient>
    <filter id="shadow5" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowO5" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f0883e"/>
    </marker>
    <marker id="arrowP5" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a371f7"/>
    </marker>
    <marker id="arrowG5" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="20" width="1340" height="70" rx="12" fill="url(#gradHeader5)" stroke="#30363d" stroke-width="1"/>
  <text x="60" y="52" fill="#f0883e" font-size="22" font-weight="bold">HIERARCHICAL MODEL ROUTER &amp; SUBAGENT SANDBOXES</text>
  <text x="60" y="74" fill="#8b949e" font-size="13">Claude Code-Style Multi-Agent Isolation • Air-Gapped Local Ollama vs. Hybrid Cloud Execution Topologies</text>

  <!-- Top Half: Hierarchical Planner / Worker Dynamic Routing -->
  <g transform="translate(40, 110)">
    <rect width="1320" height="340" rx="14" fill="url(#cardGrad5)" stroke="#f0883e" stroke-width="1.5" filter="url(#shadow5)"/>
    <rect width="450" height="36" rx="8" fill="#f0883e" fill-opacity="0.15" transform="translate(20, 15)"/>
    <text x="35" y="39" fill="#f0883e" font-size="14" font-weight="bold">1. HIERARCHICAL DUAL-TIER MODEL ROUTING</text>
    <text x="490" y="38" fill="#8b949e" font-size="12">Decouples Strategic Architectural Reasoning from Fast Mechanical Tool Execution</text>

    <!-- Supervisor Card -->
    <g transform="translate(30, 70)">
      <rect width="380" height="230" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
      <rect width="380" height="32" rx="10" fill="#d29922" fill-opacity="0.2"/>
      <text x="20" y="22" fill="#e3b341" font-size="13" font-weight="bold">SUPERVISOR / PLANNER (System 2)</text>
      
      <text x="20" y="55" fill="#f0f6fc" font-size="12" font-weight="bold">Models: <tspan fill="#e3b341">Claude 3.7 / DeepSeek-R1 / Qwen 27B</tspan></text>
      <text x="20" y="80" fill="#8b949e" font-size="11">• Invoked strictly on <tspan fill="#3fb950" font-weight="bold">Turn 1 (Planning)</tspan></text>
      <text x="20" y="100" fill="#8b949e" font-size="11">• Analyzes SBFL Ochiai suspicious lines &amp; call graph</text>
      <text x="20" y="120" fill="#8b949e" font-size="11">• Emits high-level POMDP repair hypothesis</text>
      <text x="20" y="140" fill="#8b949e" font-size="11">• Dispatches discrete sub-tasks to Worker model</text>

      <rect x="20" y="160" width="340" height="50" rx="6" fill="#21262d"/>
      <text x="30" y="180" fill="#3fb950" font-size="11" font-weight="bold">High Reasoning Token Allocation</text>
      <text x="30" y="198" fill="#8b949e" font-size="10">Spends deep compute where strategic choices matter</text>
    </g>

    <!-- Dispatch & Routing Core -->
    <g transform="translate(450, 110)">
      <rect width="360" height="150" rx="8" fill="#21262d" stroke="#30363d"/>
      <text x="20" y="30" fill="#f0f6fc" font-size="13" font-weight="bold">Dynamic Phase State-Machine</text>
      
      <text x="20" y="60" fill="#3fb950" font-size="11">Turn 1: route_to(SUPERVISOR)</text>
      <text x="20" y="80" fill="#58a6ff" font-size="11">Turns 2–N: route_to(WORKER)</text>
      <text x="20" y="100" fill="#f85149" font-size="11">2 Consecutive Fails: ESCALATE_TO_SUPERVISOR</text>

      <rect x="20" y="115" width="320" height="24" rx="4" fill="#161b22"/>
      <text x="30" y="131" fill="#e3b341" font-size="10" font-weight="bold">HierarchicalModelRouter.route_turn()</text>
    </g>

    <!-- Worker Card -->
    <g transform="translate(850, 70)">
      <rect width="440" height="230" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
      <rect width="440" height="32" rx="10" fill="#3fb950" fill-opacity="0.2"/>
      <text x="20" y="22" fill="#3fb950" font-size="13" font-weight="bold">FAST WORKER SUBAGENT (System 1)</text>
      
      <text x="20" y="55" fill="#f0f6fc" font-size="12" font-weight="bold">Models: <tspan fill="#3fb950">DeepSeek-V4 Flash ($0.10/M) / Qwen 7B ($0.00)</tspan></text>
      <text x="20" y="80" fill="#8b949e" font-size="11">• Invoked on <tspan fill="#58a6ff" font-weight="bold">Turns 2 through N (Execution)</tspan></text>
      <text x="20" y="100" fill="#8b949e" font-size="11">• Applies surgical AST chunk replacements (0.2ms preflight)</text>
      <text x="20" y="120" fill="#8b949e" font-size="11">• Executes test runner subprocesses in sandbox</text>
      <text x="20" y="140" fill="#8b949e" font-size="11">• High-speed tool turnaround: 0.8s – 1.5s per turn</text>

      <rect x="20" y="160" width="400" height="50" rx="6" fill="#21262d"/>
      <text x="30" y="180" fill="#3fb950" font-size="11" font-weight="bold">90% of Total Turns at 97% Lower Cost</text>
      <text x="30" y="198" fill="#8b949e" font-size="10">Achieves frontier SWE-bench scores at $0.00048 USD / task</text>
    </g>

    <!-- Connectors -->
    <path d="M 410 185 L 450 185" stroke="#f0883e" stroke-width="2" marker-end="url(#arrowO5)"/>
    <path d="M 810 185 L 850 185" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowG5)"/>
  </g>

  <!-- Bottom Half: Subagents & Execution Topologies -->
  <g transform="translate(40, 480)">
    <!-- Subagent Sandboxes (Left) -->
    <g transform="translate(0, 0)">
      <rect width="640" height="360" rx="14" fill="url(#cardGrad5)" stroke="#8957e5" stroke-width="1.5" filter="url(#shadow5)"/>
      <rect width="450" height="36" rx="8" fill="#8957e5" fill-opacity="0.15" transform="translate(20, 15)"/>
      <text x="35" y="39" fill="#a371f7" font-size="14" font-weight="bold">2. CLAUDE CODE SUBAGENT SANDBOXES</text>

      <g transform="translate(20, 65)">
        <!-- Scout Subagent -->
        <rect x="0" y="0" width="290" height="110" rx="8" fill="#161b22" stroke="#8957e5"/>
        <text x="15" y="25" fill="#a371f7" font-size="12" font-weight="bold">Role: Codebase Scout</text>
        <text x="15" y="48" fill="#8b949e" font-size="10">• Multi-file symbol &amp; caller search</text>
        <text x="15" y="66" fill="#8b949e" font-size="10">• Runs in dedicated ephemeral context</text>
        <text x="15" y="90" fill="#3fb950" font-size="10" font-weight="bold">Returns: File candidates list</text>

        <!-- QA Subagent -->
        <rect x="310" y="0" width="290" height="110" rx="8" fill="#161b22" stroke="#8957e5"/>
        <text x="325" y="25" fill="#a371f7" font-size="12" font-weight="bold">Role: QA Invariant Verifier</text>
        <text x="325" y="48" fill="#8b949e" font-size="10">• Synthesizes adversarial test cases</text>
        <text x="325" y="66" fill="#8b949e" font-size="10">• Proves patch against edge regressions</text>
        <text x="325" y="90" fill="#3fb950" font-size="10" font-weight="bold">Returns: Edge-case pass/fail</text>

        <!-- Summary Extractor Box -->
        <rect x="0" y="125" width="600" height="145" rx="8" fill="#21262d" stroke="#30363d"/>
        <text x="20" y="150" fill="#f0f6fc" font-size="12" font-weight="bold">SubagentCoordinator: Context Isolation Architecture</text>
        <text x="20" y="175" fill="#8b949e" font-size="11">• Ephemeral subagents generate 10k–30k tokens of raw explorer logs</text>
        <text x="20" y="195" fill="#3fb950" font-size="11" font-weight="bold">• Only 3-line structured summaries are extracted into the parent session</text>
        <text x="20" y="215" fill="#8b949e" font-size="11">• Keeps parent session under 8k tokens across 15+ turns (80%+ KV Cache Hit)</text>
        <text x="20" y="245" fill="#58a6ff" font-size="10" font-weight="bold">Total Context Isolation: Zero parent prompt bloat or hallucination drift</text>
      </g>
    </g>

    <!-- Execution Topologies (Right) -->
    <g transform="translate(680, 0)">
      <rect width="640" height="360" rx="14" fill="url(#cardGrad5)" stroke="#3fb950" stroke-width="1.5" filter="url(#shadow5)"/>
      <rect width="450" height="36" rx="8" fill="#3fb950" fill-opacity="0.15" transform="translate(20, 15)"/>
      <text x="35" y="39" fill="#3fb950" font-size="14" font-weight="bold">3. HARDWARE DEPLOYMENT TOPOLOGIES</text>

      <g transform="translate(20, 65)">
        <!-- Topology A: 100% Air-Gapped Local -->
        <rect x="0" y="0" width="600" height="120" rx="8" fill="#161b22" stroke="#3fb950"/>
        <text x="20" y="25" fill="#3fb950" font-size="13" font-weight="bold">TOPOLOGY A: 100% Air-Gapped Local Ollama (Windows Host via WSL2)</text>
        <text x="20" y="50" fill="#f0f6fc" font-size="11">• Planner: <tspan fill="#e3b341">qwen3.8:27b</tspan> | Worker: <tspan fill="#3fb950">qwen2.5-coder:7b</tspan></text>
        <text x="20" y="70" fill="#8b949e" font-size="11">• Cost: <tspan fill="#3fb950" font-weight="bold">$0.00000 USD</tspan> | 100% Offline &amp; Zero Enterprise Source Code Leakage</text>
        <text x="20" y="90" fill="#8b949e" font-size="11">• Verified Live: <tspan fill="#3fb950">3 Turns on Tier 1 LRU Cache (100% Pass Rate)</tspan></text>

        <!-- Topology B: Hybrid Cloud/Local -->
        <rect x="0" y="135" width="600" height="135" rx="8" fill="#161b22" stroke="#58a6ff"/>
        <text x="20" y="160" fill="#58a6ff" font-size="13" font-weight="bold">TOPOLOGY B: Hybrid Cloud Planner + Local Worker Stack</text>
        <text x="20" y="185" fill="#f0f6fc" font-size="11">• Cloud Supervisor (Turn 1): <tspan fill="#58a6ff">DeepSeek-V4 Flash / Claude 3.7</tspan></text>
        <text x="20" y="205" fill="#f0f6fc" font-size="11">• Local Worker (Turns 2–N): <tspan fill="#3fb950">qwen2.5-coder:7b (Local Ollama GPU)</tspan></text>
        <text x="20" y="225" fill="#8b949e" font-size="11">• Cost: <tspan fill="#3fb950" font-weight="bold">&lt; $0.0003 USD / task</tspan> | Turnaround: <tspan fill="#58a6ff" font-weight="bold">14s – 18s (3x–4x Faster)</tspan></text>
        <text x="20" y="245" fill="#e3b341" font-size="10" font-weight="bold">Best of Both Worlds: Deep Frontier Reasoning at Near-Zero Cost</text>
      </g>
    </g>
  </g>
</svg>
